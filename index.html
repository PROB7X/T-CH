<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Общий Чат</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0e0e10; color: #efeff1; height: 100vh; display: flex; flex-direction: column; }

    #login-screen {
      position: fixed; inset: 0; background: #0e0e10; display: flex;
      align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .login-box {
      background: #18181b; padding: 30px; border-radius: 10px; width: 100%; max-width: 360px;
      border: 1px solid #2f2f35; text-align: center;
    }
    .login-box h2 { margin-bottom: 15px; color: #bf94ff; }
    .login-box input {
      width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3a3a3d;
      background: #0e0e10; color: #fff; font-size: 16px; margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #9147ff; }
    #pass-input { display: none; border-color: #e91916; }
    .login-box button {
      width: 100%; padding: 12px; border-radius: 6px; border: none; background: #9147ff;
      color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .login-box button:hover { background: #772ce8; }
    #login-error { color: #ff4f4d; font-size: 14px; margin-top: 10px; }

    header {
      background: #18181b; padding: 12px 16px; border-bottom: 1px solid #2f2f35;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .online-badge { background: #2f2f35; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #00f593; }

    #admin-bar {
      display: none; background: #26171a; padding: 8px 16px; border-bottom: 1px solid #5c1e24;
      gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px;
    }
    .admin-btn {
      background: #e91916; color: #fff; border: none; padding: 4px 10px;
      border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;
    }

    #messages {
      flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .msg { line-height: 1.4; font-size: 14px; word-wrap: break-word; }
    .msg-time { color: #adadb8; font-size: 11px; margin-right: 6px; }
    .badge {
      display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 11px;
      font-weight: bold; color: #fff; margin-right: 5px; vertical-align: middle;
    }
    .nick { font-weight: bold; margin-right: 6px; cursor: pointer; }
    .sys-msg { color: #adadb8; font-style: italic; font-size: 13px; }

    .input-area {
      background: #18181b; padding: 12px 16px; border-top: 1px solid #2f2f35;
      display: flex; flex-direction: column; gap: 8px;
    }
    .emotes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .emote-btn {
      background: #2f2f35; border: none; border-radius: 4px; padding: 4px 8px;
      font-size: 16px; cursor: pointer;
    }
    .form-row { display: flex; gap: 8px; }
    #msg-input {
      flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid #3a3a3d;
      background: #0e0e10; color: #fff; font-size: 14px; outline: none;
    }
    #msg-input:focus { border-color: #9147ff; }
    #send-btn {
      padding: 10px 18px; border-radius: 6px; border: none; background: #9147ff;
      color: #fff; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>Вход в чат</h2>
      <input type="text" id="nick-input" placeholder="Введите ваш ник..." maxlength="20">
      <input type="password" id="pass-input" placeholder="Секретный код владельца...">
      <button onclick="login()">Войти</button>
      <div id="login-error"></div>
    </div>
  </div>

  <header>
    <div class="header-title">💬 Чат сообщества</div>
    <div class="online-badge">Онлайн: <span id="online-count">0</span></div>
  </header>

  <div id="admin-bar">
    <span>👑 Админ-панель:</span>
    <button class="admin-btn" onclick="sendCmd('/clear')">Очистить чат</button>
    <span style="color:#adadb8">Клик по нику — вставить /ban</span>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <div class="emotes">
      <button class="emote-btn" onclick="addEmote('🔥')">🔥</button>
      <button class="emote-btn" onclick="addEmote('😂')">😂</button>
      <button class="emote-btn" onclick="addEmote('❤️')">❤️</button>
      <button class="emote-btn" onclick="addEmote('👏')">👏</button>
      <button class="emote-btn" onclick="addEmote('💀')">💀</button>
      <button class="emote-btn" onclick="addEmote('👑')">👑</button>
      <button class="emote-btn" onclick="addEmote('🚀')">🚀</button>
    </div>
    <form class="form-row" onsubmit="sendMessage(event)">
      <input type="text" id="msg-input" placeholder="Отправить сообщение..." autocomplete="off" maxlength="500">
      <button type="submit" id="send-btn">Чат</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let me = null;

    const nickInput = document.getElementById('nick-input');
    const passInput = document.getElementById('pass-input');
    const errorBox = document.getElementById('login-error');

    const savedNick = localStorage.getItem('chat_nick');
    if (savedNick) nickInput.value = savedNick;

    nickInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    passInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    function login() {
      const nick = nickInput.value.trim();
      const password = passInput.value;
      if (!nick) return;
      errorBox.innerText = '';
      socket.emit('login', { nick, password });
    }

    socket.on('need_password', (msg) => {
      passInput.style.display = 'block';
      passInput.focus();
      errorBox.style.color = '#ffb31a';
      errorBox.innerText = msg;
    });

    socket.on('login_error', (err) => {
      errorBox.style.color = '#ff4f4d';
      errorBox.innerText = err;
    });

    socket.on('login_success', (data) => {
      me = data.user;
      localStorage.setItem('chat_nick', me.nick);
      document.getElementById('login-screen').style.display = 'none';
      if (me.isAdmin) {
        document.getElementById('admin-bar').style.display = 'flex';
      }
      data.history.forEach(renderMessage);
    });

    socket.on('online_count', (count) => {
      document.getElementById('online-count').innerText = count;
    });

    socket.on('chat_message', (msg) => {
      renderMessage(msg);
    });

    socket.on('system_message', (text) => {
      const box = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'sys-msg';
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    socket.on('clear_chat', () => {
      document.getElementById('messages').innerHTML = '';
    });

    socket.on('kicked', (reason) => {
      alert(reason);
      location.reload();
    });

    function renderMessage(msg) {
      const box = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';

      const timeSpan = `<span class="msg-time">${msg.time}</span>`;
      const badgeSpan = msg.badge
        ? `<span class="badge" style="background:${msg.badgeColor}">${escapeHtml(msg.badge)}</span>`
        : '';
      const nickSpan = `<span class="nick" style="color:${msg.nickColor}" onclick="clickNick('${escapeHtml(msg.nick)}')">${escapeHtml(msg.nick)}:</span>`;
      const textSpan = `<span>${escapeHtml(msg.text)}</span>`;

      div.innerHTML = timeSpan + badgeSpan + nickSpan + textSpan;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat_message', text);
      input.value = '';
    }

    function sendCmd(cmd) {
      socket.emit('chat_message', cmd);
    }

    function addEmote(emote) {
      const input = document.getElementById('msg-input');
      input.value += emote;
      input.focus();
    }

    function clickNick(nick) {
      const input = document.getElementById('msg-input');
      if (me && me.isAdmin) {
        input.value = `/ban ${nick}`;
      } else {
        input.value = `@${nick}, `;
      }
      input.focus();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
