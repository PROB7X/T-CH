<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-мессенджер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 15px;
            background-color: #1f1f1f;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        #status {
            font-size: 12px;
            color: #ffa500;
            margin-top: 4px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background-color: #2a2a2a;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            word-wrap: break-word;
            align-self: flex-start;
        }
        .message.mine {
            background-color: #0066cc;
            align-self: flex-end;
        }
        .sender {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
            gap: 8px;
        }
        input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        #username {
            width: 100px;
        }
        #msg-input {
            flex: 1;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <div id="header">
        Мини-мессенджер
        <div id="status">Подключение к 103.82.102.226...</div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="username" placeholder="Имя" value="Гость">
        <input type="text" id="msg-input" placeholder="Введите сообщение..." autocomplete="off">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        // Укажите здесь ваш реальный порт и путь из main.py (например, :8000/ws или :5000)
        const SERVER_URL = "ws://103.82.102.226:8000/ws";
        
        const chatBox = document.getElementById("chat-box");
        const statusEl = document.getElementById("status");
        const msgInput = document.getElementById("msg-input");
        const usernameInput = document.getElementById("username");

        let socket;

        function connect() {
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                statusEl.textContent = "В сети (103.82.102.226)";
                statusEl.style.color = "#4caf50";
            };

            socket.onmessage = (event) => {
                addMessage(event.data, false);
            };

            socket.onclose = () => {
                statusEl.textContent = "Отключено. Переподключение...";
                statusEl.style.color = "#f44336";
                setTimeout(connect, 3000);
            };

            socket.onerror = (err) => {
                console.error("Ошибка WebSocket:", err);
                statusEl.textContent = "Ошибка соединения с сервером";
                statusEl.style.color = "#f44336";
            };
        }

        function addMessage(text, isMine) {
            const div = document.createElement("div");
            div.className = "message" + (isMine ? " mine" : "");
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            const user = usernameInput.value.trim() || "Аноним";
            
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                const payload = `${user}: ${text}`;
                socket.send(payload);
                addMessage(payload, true);
                msgInput.value = "";
            }
        }

        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        connect();
    </script>

</body>
</html>
