<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров Выживания</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a252f; font-family: sans-serif; color: white; }
        
        /* Оверлей полноэкранного режима */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 30, 0.95); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        #fullscreen-btn {
            padding: 18px 36px; font-size: 20px; font-weight: bold;
            background: #27ae60; color: white; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); margin-top: 15px;
        }

        /* Главное меню */
        #menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .menu-box {
            background: rgba(0, 0, 0, 0.5); padding: 25px; border-radius: 16px;
            display: flex; flex-direction: column; gap: 15px; width: 320px; text-align: center;
        }
        input {
            padding: 12px; font-size: 18px; border-radius: 8px; border: none; text-align: center; letter-spacing: 3px;
        }
        button.action-btn {
            padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px;
            background: #e67e22; color: white; cursor: pointer;
        }
        button.action-btn.create { background: #2ecc71; }
        #error-msg { color: #ff6b6b; font-size: 14px; min-height: 18px; }

        /* Игровой интерфейс */
        #game-ui { display: none; position: fixed; top: 10px; left: 10px; z-index: 50; pointer-events: none; }
        .hud-badge {
            background: rgba(0, 0, 0, 0.6); padding: 8px 14px; border-radius: 8px; font-size: 16px; font-weight: bold;
        }

        /* Мобильный джойстик */
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px; width: 140px; height: 140px;
            z-index: 60; display: none; touch-action: none;
        }
        #joystick-base {
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            position: absolute; top: 10px; left: 10px;
        }
        #joystick-stick {
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7);
            border-radius: 50%; position: absolute; top: 35px; left: 35px;
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <!-- 1. Экран требования полного экрана и горизонтали -->
    <div id="fullscreen-overlay">
        <h2>Для игры нужен полноэкранный режим</h2>
        <p style="margin-top: 8px; color: #bdc3c7;">Экран автоматически перевернётся горизонтально</p>
        <button id="fullscreen-btn">На весь экран</button>
    </div>

    <!-- 2. Главное меню -->
    <div id="menu-screen">
        <div class="menu-box">
            <h2>🏝 Остров Выживания</h2>
            <button class="action-btn create" id="btn-create">Создать сервер</button>
            <hr style="border-color: rgba(255,255,255,0.2);">
            <input type="number" id="room-input" placeholder="Номер (4 цифры)" maxlength="4">
            <button class="action-btn" id="btn-join">Войти по номеру</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- HUD в игре -->
    <div id="game-ui">
        <div class="hud-badge">Сервер: <span id="hud-room">----</span> | Игроков: <span id="hud-players">1</span>/10</div>
    </div>

    <!-- Сенсорный джойстик -->
    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // 1. УПРАВЛЕНИЕ ПОЛНЫМ ЭКРАНОМ И ОРИЕНТАЦИЕЙ
        // ==========================================
        const fsOverlay = document.getElementById('fullscreen-overlay');
        const fsBtn = document.getElementById('fullscreen-btn');

        async function enterFullscreenAndLandscape() {
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    await elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    await elem.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (err) {
                console.log('Ошибка фуллскрина:', err);
            }
        }

        function checkFullscreen() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            fsOverlay.style.display = isFullscreen ? 'none' : 'flex';
            resizeCanvas();
        }

        fsBtn.addEventListener('click', enterFullscreenAndLandscape);
        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 2. МЕНЮ И ПОДКЛЮЧЕНИЕ К КОМНАТАМ
        // ==========================================
        const menuScreen = document.getElementById('menu-screen');
        const gameUi = document.getElementById('game-ui');
        const joystickZone = document.getElementById('joystick-zone');
        const errorMsg = document.getElementById('error-msg');

        let myId = null;
        let players = {};
        let isPlaying = false;

        document.getElementById('btn-create').addEventListener('click', () => {
            socket.emit('createRoom', handleRoomResponse);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const code = document.getElementById('room-input').value.trim();
            if (!code) return errorMsg.textContent = 'Введите номер сервера!';
            socket.emit('joinRoom', code, handleRoomResponse);
        });

        function handleRoomResponse(res) {
            if (res.error) {
                errorMsg.textContent = res.error;
                return;
            }
            myId = res.myId;
            players = res.players;
            document.getElementById('hud-room').textContent = res.roomCode;
            updatePlayerCount();

            generateIsland(res.seed);

            menuScreen.style.display = 'none';
            gameUi.style.display = 'block';
            joystickZone.style.display = 'block';
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        }

        function updatePlayerCount() {
            document.getElementById('hud-players').textContent = Object.keys(players).length;
        }

        socket.on('playerJoined', (p) => { players[p.id] = p; updatePlayerCount(); });
        socket.on('playerMoved', (p) => { if (players[p.id]) { players[p.id].x = p.x; players[p.id].y = p.y; } });
        socket.on('playerLeft', (id) => { delete players[id]; updatePlayerCount(); });

        // ==========================================
        // 3. ГЕНЕРАЦИЯ ОСТРОВА ПО СИДУ
        // ==========================================
        const WORLD_SIZE = 4000;
        const TILE_SIZE = 64;
        const GRID_COUNT = Math.ceil(WORLD_SIZE / TILE_SIZE);
        let worldGrid = []; // 0: вода, 1: песок, 2: трава
        let worldObjects = []; // Деревья и камни

        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function generateIsland(seed) {
            const rand = mulberry32(seed);
            worldGrid = [];
            worldObjects = [];
            const center = GRID_COUNT / 2;

            for (let y = 0; y < GRID_COUNT; y++) {
                let row = [];
                for (let x = 0; x < GRID_COUNT; x++) {
                    const dx = x - center;
                    const dy = y - center;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const noise = (rand() - 0.5) * 4;

                    if (dist + noise > center * 0.75) row.push(0);      // Океан
                    else if (dist + noise > center * 0.62) row.push(1); // Песок
                    else row.push(2);                                   // Трава
                }
                worldGrid.push(row);
            }

            for (let i = 0; i < 400; i++) {
                const ox = rand() * WORLD_SIZE;
                const oy = rand() * WORLD_SIZE;
                const gx = Math.floor(ox / TILE_SIZE);
                const gy = Math.floor(oy / TILE_SIZE);

                if (worldGrid[gy] && worldGrid[gy][gx] === 2) {
                    worldObjects.push({
                        x: ox,
                        y: oy,
                        type: rand() > 0.3 ? 'tree' : 'rock',
                        radius: rand() > 0.3 ? 28 : 20
                    });
                }
            }
        }
        // ==========================================
        // 4. МОБИЛЬНОЕ УПРАВЛЕНИЕ (ДЖОЙСТИК + КЛАВИШИ)
        // ==========================================
        let moveVec = { x: 0, y: 0 };
        const stick = document.getElementById('joystick-stick');
        const base = document.getElementById('joystick-base');
        let touchId = null;

        base.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches;
            touchId = touch.identifier;
            updateJoystick(touch);
        });

        base.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    updateJoystick(e.changedTouches[i]);
                }
            }
        });

        const resetJoystick = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    touchId = null;
                    stick.style.transform = `translate(0px, 0px)`;
                    moveVec = { x: 0, y: 0 };
                }
            }
        };
        base.addEventListener('touchend', resetJoystick);
        base.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxDist = 40;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVec.x = dx / maxDist;
            moveVec.y = dy / maxDist;
        }

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // ==========================================
        // 5. ИГРОВОЙ ЦИКЛ И ОПТИМИЗИРОВАННЫЙ РЕНДЕР
        // ==========================================
        let lastEmit = 0;

        function gameLoop(timestamp) {
            if (!isPlaying) return;

            const me = players[myId];
            if (me) {
                let vx = moveVec.x;
                let vy = moveVec.y;
                if (vx === 0 && vy === 0) {
                    if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
                    if (keys['KeyS'] || keys['ArrowDown']) vy += 1;
                    if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
                    if (keys['KeyD'] || keys['ArrowRight']) vx += 1;
                    if (vx !== 0 && vy !== 0) {
                        const len = Math.sqrt(vx * vx + vy * vy);
                        vx /= len; vy /= len;
                    }
                }

                if (vx !== 0 || vy !== 0) {
                    const speed = 4;
                    me.x = Math.max(0, Math.min(WORLD_SIZE, me.x + vx * speed));
                    me.y = Math.max(0, Math.min(WORLD_SIZE, me.y + vy * speed));

                    if (timestamp - lastEmit > 33) {
                        socket.emit('move', { x: me.x, y: me.y });
                        lastEmit = timestamp;
                    }
                }

                render(me);
            }

            requestAnimationFrame(gameLoop);
        }

        function render(cameraTarget) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const camX = cameraTarget.x - canvas.width / 2;
            const camY = cameraTarget.y - canvas.height / 2;

            // ЗАПАС ДЛЯ ОТСЕЧЕНИЯ (чтобы края не мигали)
            const CULL_PADDING = 100;
            const viewLeft = camX - CULL_PADDING;
            const viewRight = camX + canvas.width + CULL_PADDING;
            const viewTop = camY - CULL_PADDING;
            const viewBottom = camY + canvas.height + CULL_PADDING;

            // 1. Видимые тайлы земли
            const startCol = Math.max(0, Math.floor(viewLeft / TILE_SIZE));
            const endCol = Math.min(GRID_COUNT - 1, Math.ceil(viewRight / TILE_SIZE));
            const startRow = Math.max(0, Math.floor(viewTop / TILE_SIZE));
            const endRow = Math.min(GRID_COUNT - 1, Math.ceil(viewBottom / TILE_SIZE));

            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    const tile = worldGrid[r][c];
                    if (tile === 0) ctx.fillStyle = '#2980b9';
                    else if (tile === 1) ctx.fillStyle = '#f1c40f';
                    else ctx.fillStyle = '#2ecc71';

                    ctx.fillRect(
                        Math.floor(c * TILE_SIZE - camX),
                        Math.floor(r * TILE_SIZE - camY),
                        TILE_SIZE + 1,
                        TILE_SIZE + 1
                    );
                }
            }

            // 2. Видимые объекты (деревья и камни)
            for (let i = 0; i < worldObjects.length; i++) {
                const obj = worldObjects[i];
                if (obj.x + obj.radius < viewLeft || obj.x - obj.radius > viewRight ||
                    obj.y + obj.radius < viewTop || obj.y - obj.radius > viewBottom) {
                    continue;
                }

                const screenX = obj.x - camX;
                const screenY = obj.y - camY;

                ctx.fillStyle = obj.type === 'tree' ? '#1e8449' : '#7f8c8d';
                ctx.beginPath();
                ctx.arc(screenX, screenY, obj.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Видимые игроки
            for (let id in players) {
                const p = players[id];
                const playerRadius = 18;
                if (p.x + playerRadius < viewLeft || p.x - playerRadius > viewRight ||
                    p.y + playerRadius < viewTop || p.y - playerRadius > viewBottom) {
                    continue;
                }

                const screenX = p.x - camX;
                const screenY = p.y - camY;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(screenX, screenY, playerRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
