<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NioLit OS</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 15%, #1e293b 0%, #0f172a 55%, #020617 100%);
      --glass: rgba(15, 23, 42, 0.88);
      --glass-card: rgba(30, 41, 59, 0.85);
      --border: rgba(148, 163, 184, 0.2);
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --gold: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --status-h: 32px;
      --nav-h: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    svg {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Золотой ник администратора */
    .admin-nick {
      color: var(--gold) !important;
      font-weight: 800;
      text-shadow: 0 0 10px var(--gold-glow);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Верхний статус-бар телефона */
    #status-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--status-h);
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12px;
      z-index: 8000;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Рабочий стол (сетка иконок для смартфона) */
    #desktop {
      position: fixed;
      top: var(--status-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      padding: 22px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      grid-auto-rows: 96px;
      gap: 16px;
      align-content: start;
      overflow-y: auto;
    }

    .app-shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .app-shortcut:active .app-icon-wrap {
      transform: scale(0.92);
    }

    .app-icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--glass-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s;
      color: var(--accent);
    }

    .app-shortcut span {
      font-size: 12px;
      text-align: center;
      color: var(--text);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    /* Полноэкранные мобильные окна */
    .mobile-window {
      position: fixed;
      top: var(--status-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      z-index: 500;
    }

    /* Отсечение 100% невидимых окон */
    .mobile-window.culled {
      display: none !important;
    }

    .win-header {
      height: 46px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-weight: 600;
      font-size: 15px;
    }

    .win-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .win-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      user-select: text;
    }

    /* Нижняя навигационная панель телефона */
    #nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--nav-h);
      background: rgba(2, 6, 23, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 8000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      width: 64px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    /* Диспетчер открытых приложений */
    #recents-overlay {
      position: fixed;
      top: var(--status-h);
      bottom: var(--nav-h);
      left: 0;
      right: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(14px);
      z-index: 7000;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    #recents-overlay.open {
      display: flex;
    }

    .recent-card {
      background: var(--glass-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Модальные экраны: Полноэкранный режим и Авторизация */
    .full-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(18px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .full-overlay.hidden {
      display: none;
    }

    .close-corner {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: var(--glass-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal-card h2 {
      font-size: 22px;
      text-align: center;
      color: var(--accent);
    }

    .modal-card p {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(2, 6, 23, 0.6);
      padding: 4px;
      border-radius: 10px;
    }

    .auth-tab {
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--accent);
      color: #020617;
    }

    .field-input {
      width: 100%;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #020617;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-small {
      background: var(--accent);
      color: #020617;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }

    /* Элементы внутри приложений */
    .sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .sub-tab {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .sub-tab.active {
      background: var(--accent);
      color: #020617;
      border-color: var(--accent);
    }

    .card-item {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 8px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-mine {
      align-self: flex-end;
      background: var(--accent-dark);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .msg-other {
      align-self: flex-start;
      background: var(--glass-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
      flex: 1;
    }

    .calc-key {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. ЭКРАН ПОЛНОЭКРАННОГО РЕЖИМА -->
  <div id="fs-overlay" class="full-overlay">
    <button id="fs-dismiss" class="close-corner" aria-label="Закрыть">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-card">
      <h2>NioLit OS</h2>
      <p>Разверните систему на весь экран для удобного управления со смартфона.</p>
      <button id="fs-enter" class="btn-primary">На весь экран</button>
    </div>
  </div>

  <!-- 2. ЭКРАН ВХОДА И РЕГИСТРАЦИИ (ПОЯВЛЯЕТСЯ ПРИ КАЖДОМ ЗАПУСКЕ) -->
  <div id="auth-overlay" class="full-overlay">
    <div class="modal-card">
      <h2>Вход в NioLit</h2>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Вход</button>
        <button class="auth-tab" data-mode="register">Регистрация</button>
      </div>
      <input type="text" id="auth-user" class="field-input" placeholder="Имя пользователя" autocomplete="off" />
      <input type="password" id="auth-pass" class="field-input" placeholder="Пароль (по желанию)" />
      <div id="auth-error" class="error-msg"></div>
      <button id="auth-submit" class="btn-primary">Продолжить</button>
    </div>
  </div>

  <!-- СТАТУС-БАР -->
  <header id="status-bar">
    <div class="status-group">
      <strong style="color:var(--accent)">NioLit</strong>
      <span id="status-user">Гость</span>
    </div>
    <div class="status-group">
      <span id="render-info" style="color:var(--muted)">Рендер: 0/0</span>
      <span id="net-indicator" style="display:inline-flex;align-items:center;gap:4px;color:var(--success)">
        <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg>
        <span>:3000</span>
      </span>
      <span id="clock">00:00</span>
    </div>
  </header>

  <!-- РАБОЧИЙ СТОЛ -->
  <main id="desktop"></main>

  <!-- ДИСПЕТЧЕР ОТКРЫТЫХ ОКОН -->
  <div id="recents-overlay"></div>

  <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ СМАРТФОНА -->
  <nav id="nav-bar">
    <button class="nav-btn" id="nav-back" aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="nav-home" aria-label="Домой">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="nav-btn" id="nav-recents" aria-label="Окна">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    </button>
  </nav>

<script>
(() => {
  /* =========================================================================
     НАБОР ВЕКТОРНЫХ SVG-ИКОНОК (БЕЗ СМАЙЛИКОВ)
     ========================================================================= */
  const ICONS = {
    niogram: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    notes: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
    calc: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="18" x2="16" y2="18"/></svg>',
    profile: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    crown: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"><path d="M2 17l2-11 5 4 3-6 3 6 5-4 2 11H2z"/><rect x="2" y="19" width="20" height="2" rx="1"/></svg>',
    heart: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    userPlus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>',
    check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>'
  };

  function formatNick(username, isAdmin) {
    if (isAdmin || String(username).toUpperCase() === 'HELM77ZX') {
      return `<span class="admin-nick">${ICONS.crown}<span>${username}</span></span>`;
    }
    return `<span>${username}</span>`;
  }

  /* =========================================================================
     ПОДКЛЮЧЕНИЕ К ПОРТУ 3000
     ========================================================================= */
  const API_BASE = window.location.port === '3000'
    ? ''
    : `${window.location.protocol}//${window.location.hostname}:3000`;

  let currentUser = null; // { username, isAdmin }

  setInterval(() => {
    if (!currentUser) return;
    fetch(`${API_BASE}/api/heartbeat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser.username })
    }).catch(() => {});
  }, 5000);

  window.addEventListener('beforeunload', () => {
    if (!currentUser) return;
    navigator.sendBeacon(`${API_BASE}/api/logout`, JSON.stringify({ username: currentUser.username }));
  });

  /* =========================================================================
     1. УПРАВЛЕНИЕ ПОЛНОЭКРАННЫМ РЕЖИМОМ
     ========================================================================= */
  const fsOverlay = document.getElementById('fs-overlay');
  const fsEnter = document.getElementById('fs-enter');
  const fsDismiss = document.getElementById('fs-dismiss');

  fsEnter.onclick = async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
      fsOverlay.classList.add('hidden');
    } catch (e) {
      fsOverlay.classList.add('hidden');
    }
  };

  fsDismiss.onclick = () => {
    fsOverlay.classList.add('hidden');
  };

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fsOverlay.classList.add('hidden');
    } else {
      fsOverlay.classList.remove('hidden');
    }
  });

  /* =========================================================================
     2. РЕГИСТРАЦИЯ И ВХОД ПРИ КАЖДОМ ЗАПУСКЕ
     ========================================================================= */
  const authOverlay = document.getElementById('auth-overlay');
  const authTabs = document.querySelectorAll('.auth-tab');
  const authUser = document.getElementById('auth-user');
  const authPass = document.getElementById('auth-pass');
  const authError = document.getElementById('auth-error');
  const authSubmit = document.getElementById('auth-submit');
  let authMode = 'login';

  authTabs.forEach(tab => {
    tab.onclick = () => {
      authTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      authMode = tab.dataset.mode;
      authError.textContent = '';
    };
  });

  authUser.addEventListener('input', () => {
    if (authUser.value.trim().toUpperCase() === 'HELM77ZX') {
      authPass.placeholder = 'Введите пароль администратора из secret.json';
    } else {
      authPass.placeholder = 'Пароль (по желанию)';
    }
  });

  async function performAuth() {
    const username = authUser.value.trim();
    const password = authPass.value.trim();
    authError.textContent = '';

    if (!username) {
      authError.textContent = 'Введите имя пользователя';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: authMode, username, password })
      });
      const data = await res.json();
      if (!data.ok) {
        authError.textContent = data.error || 'Ошибка входа';
        return;
      }

      currentUser = data.user;
      document.getElementById('status-user').innerHTML = formatNick(currentUser.username, currentUser.isAdmin);
      authOverlay.classList.add('hidden');
      authPass.value = '';
    } catch (e) {
      authError.textContent = 'Нет связи с сервером на порту 3000';
    }
  }

  authSubmit.onclick = performAuth;
  authPass.addEventListener('keydown', e => { if (e.key === 'Enter') performAuth(); });

  /* =========================================================================
     3. МЕНЕДЖЕР ОКОН С 100% ОТСЕЧЕНИЕМ (OCCLUSION CULLING)
     ========================================================================= */
  const openWindows = []; // Стек открытых приложений, верхнее — последнее в массиве
  let activeChatPeer = null;

  function updateRenderCulling() {
    // На мобильном экране верхнее окно перекрывает все нижние на 100%
    const total = openWindows.length;
    let rendered = 0;

    openWindows.forEach((win, index) => {
      const isTop = (index === total - 1);
      if (isTop) {
        win.el.classList.remove('culled');
        rendered++;
      } else {
        // Окно полностью скрыто под верхним окном — отключаем его отрисовку
        win.el.classList.add('culled');
      }
    });

    document.getElementById('render-info').textContent = `Рендер: ${rendered}/${total}`;
  }

  function closeWindow(appId) {
    const idx = openWindows.findIndex(w => w.id === appId);
    if (idx !== -1) {
      openWindows[idx].el.remove();
      openWindows.splice(idx, 1);
      updateRenderCulling();
    }
  }

  function openApp(app) {
    const existingIdx = openWindows.findIndex(w => w.id === app.id);
    if (existingIdx !== -1) {
      const [win] = openWindows.splice(existingIdx, 1);
      openWindows.push(win);
      updateRenderCulling();
      return;
    }

    const winEl = document.createElement('section');
    winEl.className = 'mobile-window';
    winEl.innerHTML = `
      <div class="win-header">
        <div style="display:flex;align-items:center;gap:8px;">${app.icon}<span>${app.name}</span></div>
        <button class="win-close-btn" aria-label="Закрыть">${ICONS.close}</button>
      </div>
      <div class="win-body"></div>
    `;

    winEl.querySelector('.win-close-btn').onclick = () => closeWindow(app.id);
    document.body.appendChild(winEl);

    const winObj = { id: app.id, name: app.name, icon: app.icon, el: winEl };
    openWindows.push(winObj);
    app.render(winEl.querySelector('.win-body'));
    updateRenderCulling();
  }

  // Навигация снизу: Назад, Домой, Диспетчер окон
  const recentsOverlay = document.getElementById('recents-overlay');

  document.getElementById('nav-back').onclick = () => {
    if (recentsOverlay.classList.contains('open')) {
      recentsOverlay.classList.remove('open');
      return;
    }
    if (activeChatPeer) {
      activeChatPeer = null;
      const niogramWin = openWindows.find(w => w.id === 'niogram');
      if (niogramWin) APPS[0].render(niogramWin.el.querySelector('.win-body'));
      return;
    }
    if (openWindows.length > 0) {
      closeWindow(openWindows[openWindows.length - 1].id);
    }
  };

  document.getElementById('nav-home').onclick = () => {
    recentsOverlay.classList.remove('open');
    while (openWindows.length > 0) {
      closeWindow(openWindows[openWindows.length - 1].id);
    }
  };

  document.getElementById('nav-recents').onclick = () => {
    if (recentsOverlay.classList.contains('open')) {
      recentsOverlay.classList.remove('open');
      return;
    }
    recentsOverlay.innerHTML = '<h3 style="font-size:16px;margin-bottom:6px;">Открытые приложения</h3>';
    if (openWindows.length === 0) {
      recentsOverlay.innerHTML += '<p style="color:var(--muted);font-size:13px;">Нет активных окон</p>';
    } else {
      openWindows.forEach(w => {
        const card = document.createElement('div');
        card.className = 'recent-card';
        card.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">${w.icon}<strong>${w.name}</strong></div>
          <div style="display:flex;gap:8px;">
            <button class="btn-small open-rec">Открыть</button>
            <button class="btn-small close-rec" style="background:var(--danger);color:#fff;">Закрыть</button>
          </div>
        `;
        card.querySelector('.open-rec').onclick = () => {
          recentsOverlay.classList.remove('open');
          openApp(APPS.find(a => a.id === w.id));
        };
        card.querySelector('.close-rec').onclick = () => {
          closeWindow(w.id);
          card.remove();
        };
        recentsOverlay.appendChild(card);
      });
    }
    recentsOverlay.classList.add('open');
  };

  /* =========================================================================
     4. ПРИЛОЖЕНИЯ СИСТЕМЫ (СОЦСЕТЬ NIOGRAM, ЗАМЕТКИ, КАЛЬКУЛЯТОР, ПРОФИЛЬ)
     ========================================================================= */
  const APPS = [
    {
      id: 'niogram',
      name: 'NioGram',
      icon: ICONS.niogram,
      render: (container) => {
        let currentTab = activeChatPeer ? 'chats' : 'feed';

        function renderShell() {
          container.innerHTML = `
            <div class="sub-tabs">
              <button class="sub-tab ${currentTab === 'feed' ? 'active' : ''}" data-t="feed">Лента</button>
              <button class="sub-tab ${currentTab === 'friends' ? 'active' : ''}" data-t="friends">Друзья и заявки</button>
              <button class="sub-tab ${currentTab === 'chats' ? 'active' : ''}" data-t="chats">Личка (7 дн.)</button>
            </div>
            <div id="ng-view" style="flex:1;display:flex;flex-direction:column;overflow-y:auto;"></div>
          `;
          container.querySelectorAll('.sub-tab').forEach(b => {
            b.onclick = () => {
              activeChatPeer = null;
              currentTab = b.dataset.t;
              renderShell();
            };
          });
          const view = container.querySelector('#ng-view');
          if (currentTab === 'feed') loadFeed(view);
          if (currentTab === 'friends') loadFriends(view);
          if (currentTab === 'chats') loadChats(view);
        }

        async function loadFeed(view) {
          view.innerHTML = `
            <div style="display:flex;gap:6px;margin-bottom:12px;">
              <input type="text" id="post-txt" class="field-input" placeholder="Новая запись..." />
              <button id="post-send" class="btn-small">Пост</button>
            </div>
            <div id="posts-box">Загрузка...</div>
          `;
          const box = view.querySelector('#posts-box');

          async function refreshPosts() {
            try {
              const res = await fetch(`${API_BASE}/api/posts`);
              const data = await res.json();
              box.innerHTML = data.posts.map(p => `
                <div class="card-item">
                  <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;">
                    ${formatNick(p.author, p.isAdmin)}
                    <span style="color:var(--muted);font-size:11px;">${p.time}</span>
                  </div>
                  <div style="font-size:14px;margin-bottom:8px;">${p.text}</div>
                  <button class="like-btn" data-id="${p.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;">
                    ${ICONS.heart} <span>${p.likes}</span>
                  </button>
                </div>
              `).join('');

              box.querySelectorAll('.like-btn').forEach(btn => {
                btn.onclick = async () => {
                  await fetch(`${API_BASE}/api/posts/${btn.dataset.id}/like`, { method: 'POST' });
                  refreshPosts();
                };
              });
            } catch (e) {
              box.innerHTML = '<p style="color:var(--danger);font-size:13px;">Ошибка загрузки ленты</p>';
            }
          }

          view.querySelector('#post-send').onclick = async () => {
            const inp = view.querySelector('#post-txt');
            if (!inp.value.trim()) return;
            await fetch(`${API_BASE}/api/posts`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ author: currentUser.username, text: inp.value.trim() })
            });
            inp.value = '';
            refreshPosts();
          };

          refreshPosts();
        }

        async function loadFriends(view) {
          view.innerHTML = `
            <div style="display:flex;gap:6px;margin-bottom:10px;">
              <input type="text" id="friend-name" class="field-input" placeholder="Ник пользователя..." />
              <button id="friend-add" class="btn-small" style="display:inline-flex;align-items:center;gap:4px;">${ICONS.userPlus} Заявка</button>
            </div>
            <div id="friend-msg" style="font-size:12px;color:var(--accent);margin-bottom:10px;"></div>
            <div id="friends-lists">Загрузка...</div>
          `;

          const msgEl = view.querySelector('#friend-msg');
          const listsEl = view.querySelector('#friends-lists');

          async function refreshSocial() {
            const res = await fetch(`${API_BASE}/api/social/${encodeURIComponent(currentUser.username)}`);
            const data = await res.json();
            const incoming = data.requests.filter(r => r.to === currentUser.username && r.status === 'pending');
            const outgoing = data.requests.filter(r => r.from === currentUser.username && r.status === 'pending');
            const accepted = data.requests.filter(r => r.status === 'accepted');

            let html = '';
            if (incoming.length > 0) {
              html += '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Входящие заявки (хранятся 7 дней):</div>';
              incoming.forEach(r => {
                html += `
                  <div class="card-item" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>${r.from}</span>
                    <button class="btn-small accept-req" data-id="${r.id}" style="display:inline-flex;align-items:center;gap:4px;">${ICONS.check} Принять</button>
                  </div>
                `;
              });
            }

            if (outgoing.length > 0) {
              html += '<div style="font-size:12px;color:var(--muted);margin:8px 0 6px;">Ожидают одобрения:</div>';
              outgoing.forEach(r => {
                html += `<div class="card-item" style="font-size:13px;color:var(--muted);">Заявка для <strong>${r.to}</strong> (ожидает)</div>`;
              });
            }

            html += '<div style="font-size:12px;color:var(--muted);margin:8px 0 6px;">Ваши друзья:</div>';
            if (accepted.length === 0) {
              html += '<p style="font-size:13px;color:var(--muted);">Список друзей пуст. Отправьте заявку, чтобы открыть личку.</p>';
            } else {
              accepted.forEach(r => {
                const friendNick = r.from === currentUser.username ? r.to : r.from;
                const uInfo = data.users.find(u => u.username === friendNick);
                html += `
                  <div class="card-item" style="display:flex;justify-content:space-between;align-items:center;">
                    <div>${formatNick(friendNick, uInfo && uInfo.isAdmin)}</div>
                    <button class="btn-small open-dm" data-peer="${friendNick}">Написать</button>
                  </div>
                `;
              });
            }

            listsEl.innerHTML = html;

            listsEl.querySelectorAll('.accept-req').forEach(btn => {
              btn.onclick = async () => {
                await fetch(`${API_BASE}/api/friends/accept`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ id: btn.dataset.id, username: currentUser.username })
                });
                refreshSocial();
              };
            });

            listsEl.querySelectorAll('.open-dm').forEach(btn => {
              btn.onclick = () => {
                activeChatPeer = btn.dataset.peer;
                currentTab = 'chats';
                renderShell();
              };
            });
          }

          view.querySelector('#friend-add').onclick = async () => {
            const target = view.querySelector('#friend-name').value.trim();
            if (!target) return;
            const res = await fetch(`${API_BASE}/api/friends/request`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ from: currentUser.username, to: target })
            });
            const data = await res.json();
            msgEl.textContent = data.ok ? 'Заявка отправлена (действует 7 дней)' : (data.error || 'Ошибка');
            view.querySelector('#friend-name').value = '';
            refreshSocial();
          };

          refreshSocial();
        }

        async function loadChats(view) {
          if (!activeChatPeer) {
            const res = await fetch(`${API_BASE}/api/social/${encodeURIComponent(currentUser.username)}`);
            const data = await res.json();
            const accepted = data.requests.filter(r => r.status === 'accepted');

            if (accepted.length === 0) {
              view.innerHTML = '<p style="color:var(--muted);font-size:13px;">У вас пока нет одобренных друзей. Перейдите во вкладку «Друзья и заявки».</p>';
              return;
            }

            view.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Выберите чат (сообщения удаляются через 7 дней):</div>' +
              accepted.map(r => {
                const peer = r.from === currentUser.username ? r.to : r.from;
                const uInfo = data.users.find(u => u.username === peer);
                return `
                  <div class="card-item select-peer" data-peer="${peer}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
                    <div>${formatNick(peer, uInfo && uInfo.isAdmin)}</div>
                    <span style="font-size:12px;color:var(--accent);">Открыть чат</span>
                  </div>
                `;
              }).join('');

            view.querySelectorAll('.select-peer').forEach(el => {
              el.onclick = () => {
                activeChatPeer = el.dataset.peer;
                loadChats(view);
              };
            });
            return;
          }

          // Окно диалога с конкретным другом
          view.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:8px;">
              <strong style="font-size:14px;">Чат с ${activeChatPeer}</strong>
              <button id="back-to-dialogs" class="btn-small" style="background:rgba(255,255,255,0.1);color:#fff;">К списку</button>
            </div>
            <div id="dm-history" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-right:4px;"></div>
            <div style="display:flex;gap:6px;margin-top:8px;">
              <input type="text" id="dm-input" class="field-input" placeholder="Сообщение (удалится через 7 дн.)..." />
              <button id="dm-send" class="btn-small">Отпр.</button>
            </div>
          `;

          view.querySelector('#back-to-dialogs').onclick = () => {
            activeChatPeer = null;
            loadChats(view);
          };

          const histEl = view.querySelector('#dm-history');

          async function loadMessages() {
            if (!activeChatPeer) return;
            const res = await fetch(`${API_BASE}/api/dm/${encodeURIComponent(currentUser.username)}/${encodeURIComponent(activeChatPeer)}`);
            const data = await res.json();
            if (!data.ok) {
              histEl.innerHTML = `<p style="color:var(--danger);font-size:13px;">${data.error}</p>`;
              return;
            }
            histEl.innerHTML = data.messages.map(m => {
              const mine = m.from === currentUser.username;
              return `
                <div class="msg-bubble ${mine ? 'msg-mine' : 'msg-other'}">
                  <div>${m.text}</div>
                  <div style="font-size:10px;opacity:0.7;text-align:right;margin-top:3px;">${m.time}</div>
                </div>
              `;
            }).join('');
            histEl.scrollTop = histEl.scrollHeight;
          }

          async function sendMsg() {
            const inp = view.querySelector('#dm-input');
            const text = inp.value.trim();
            if (!text) return;
            inp.value = '';
            await fetch(`${API_BASE}/api/dm`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ from: currentUser.username, to: activeChatPeer, text })
            });
            loadMessages();
          }

          view.querySelector('#dm-send').onclick = sendMsg;
          view.querySelector('#dm-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
          loadMessages();
        }

        renderShell();
      }
    },
    {
      id: 'notes',
      name: 'Заметки',
      icon: ICONS.notes,
      render: (container) => {
        const key = `niolit_notes_${currentUser ? currentUser.username : 'guest'}`;
        const saved = localStorage.getItem(key) || '';
        container.innerHTML = `
          <textarea id="note-area" class="field-input" style="flex:1;resize:none;margin-bottom:10px;" placeholder="Текст заметки...">${saved}</textarea>
          <button id="note-save" class="btn-primary">Сохранить</button>
        `;
        container.querySelector('#note-save').onclick = () => {
          localStorage.setItem(key, container.querySelector('#note-area').value);
        };
      }
    },
    {
      id: 'calc',
      name: 'Калькулятор',
      icon: ICONS.calc,
      render: (container) => {
        container.innerHTML = `
          <input type="text" id="calc-screen" class="field-input" style="text-align:right;font-size:24px;font-weight:700;" readonly value="0" />
          <div class="calc-grid">
            ${['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(k => `<button class="calc-key">${k}</button>`).join('')}
          </div>
        `;
        const scr = container.querySelector('#calc-screen');
        container.querySelectorAll('.calc-key').forEach(btn => {
          btn.onclick = () => {
            const val = btn.textContent;
            if (val === 'C') scr.value = '0';
            else if (val === '=') {
              try { scr.value = Function('"use strict";return (' + scr.value + ')')(); }
              catch { scr.value = 'Ошибка'; }
            } else {
              scr.value = scr.value === '0' ? val : scr.value + val;
            }
          };
        });
      }
    },
    {
      id: 'profile',
      name: 'Профиль',
      icon: ICONS.profile,
      render: (container) => {
        container.innerHTML = `
          <div class="card-item" style="display:flex;flex-direction:column;gap:8px;">
            <div style="font-size:12px;color:var(--muted);">Текущий аккаунт:</div>
            <div style="font-size:18px;">${formatNick(currentUser.username, currentUser.isAdmin)}</div>
            <div style="font-size:12px;color:var(--muted);">Статус: ${currentUser.isAdmin ? 'Администратор системы' : 'Пользователь'}</div>
          </div>
          <button id="logout-btn" class="btn-primary" style="background:var(--danger);color:#fff;margin-top:10px;">Выйти из аккаунта</button>
        `;
        container.querySelector('#logout-btn').onclick = async () => {
          await fetch(`${API_BASE}/api/logout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username })
          }).catch(() => {});
          currentUser = null;
          while (openWindows.length > 0) closeWindow(openWindows[0].id);
          authOverlay.classList.remove('hidden');
        };
      }
    }
  ];

  // Отрисовка ярлыков на рабочем столе
  const desktop = document.getElementById('desktop');
  APPS.forEach(app => {
    const el = document.createElement('div');
    el.className = 'app-shortcut';
    el.innerHTML = `<div class="app-icon-wrap">${app.icon}</div><span>${app.name}</span>`;
    el.onclick = () => openApp(app);
    desktop.appendChild(el);
  });

  // Часы
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent =
      `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }, 1000);
})();
</script>
</body>
</html>
