<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gartic Sketch 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #1e1b4b; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        .card { background: #312e81; border: 1px solid #4338ca; border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 14px; }
        .hidden { display: none !important; }
        .header-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 800; color: #a5b4fc; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #4f46e5; background: #1e1b4b; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #818cf8; }
        button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-green { background: #10b981; }
        .btn-orange { background: #f59e0b; }
        .btn-blue { background: #3b82f6; }
        .btn-gray { background: #475569; }
        .error { color: #fca5a5; font-size: 14px; text-align: center; min-height: 18px; }
        .player-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
        .player-item { background: #1e1b4b; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .badge { background: #4f46e5; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
        
        /* Холст и инструменты рисования */
        #draw-canvas { background: #ffffff; border-radius: 12px; width: 100%; aspect-ratio: 4 / 3; touch-action: none; cursor: crosshair; display: block; border: 3px solid #4f46e5; }
        .tools-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-dot.active { border-color: #ffffff; transform: scale(1.15); }
        .tool-btn { width: auto; padding: 8px 12px; font-size: 14px; background: #1e1b4b; border: 1px solid #4f46e5; }
        .tool-btn.active { background: #4f46e5; }

        /* Альбом результатов */
        .prompt-box { background: #1e1b4b; padding: 14px; border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; border: 1px dashed #818cf8; }
        .result-img { width: 100%; border-radius: 10px; background: white; border: 2px solid #4f46e5; }
        .album-step { background: #1e1b4b; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
        .author-tag { font-size: 12px; color: #a5b4fc; font-weight: 700; }
    </style>
</head>
<body>

    <!-- 1. ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="card">
        <div class="header-row">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
            <span>Gartic Sketch 2D</span>
        </div>
        <input type="text" id="input-name" placeholder="Твоё имя" maxlength="14">
        <button id="btn-create" class="btn-green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Создать комнату</span>
        </button>
        <hr style="border-color: #4338ca;">
        <input type="number" id="input-code" placeholder="Код комнаты (4 цифры)">
        <button id="btn-join" class="btn-orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            <span>Войти по коду</span>
        </button>
        <div id="menu-error" class="error"></div>
    </div>

    <!-- 2. ЛОББИ КОМНАТЫ -->
    <div id="screen-lobby" class="card hidden">
        <div class="header-row">
            <span>Комната: <span id="lobby-code" style="color: #34d399;">----</span></span>
        </div>
        <div style="text-align: center; font-size: 14px; color: #cbd5e1;">Игроки (<span id="lobby-count">1</span>/10):</div>
        <ul id="lobby-players" class="player-list"></ul>
        <button id="btn-start" class="btn-green hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Начать игру</span>
        </button>
        <div id="lobby-wait-text" style="text-align: center; color: #a5b4fc; font-size: 14px;">Ждём, пока создатель запустит игру...</div>
        <div id="lobby-error" class="error"></div>
    </div>

    <!-- 3. ИГРОВОЙ ЭКРАН (ТЕКСТ ИЛИ РИСОВАНИЕ) -->
    <div id="screen-game" class="card hidden">
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #a5b4fc; font-weight: 700;">
            <span>Этап <span id="round-num">1</span> из <span id="round-max">4</span></span>
            <span id="wait-counter"></span>
        </div>

        <!-- Режим написания текста -->
        <div id="mode-write" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
            <div id="write-instruction" style="text-align: center; font-weight: 700;">Придумай смешную фразу:</div>
            <img id="img-to-guess" class="result-img hidden" alt="Рисунок">
            <input type="text" id="input-phrase" placeholder="Напиши сюда..." maxlength="60">
        </div>

        <!-- Режим рисования -->
        <div id="mode-draw" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 13px; text-align: center; color: #cbd5e1;">Нарисуй это:</div>
            <div id="text-to-draw" class="prompt-box"></div>
            <canvas id="draw-canvas" width="400" height="300"></canvas>
            <div class="tools-bar" id="palette"></div>
            <div class="tools-bar">
                <button type="button" class="tool-btn active" data-size="4">Тонко</button>
                <button type="button" class="tool-btn" data-size="10">Средне</button>
                <button type="button" class="tool-btn" data-size="22">Толсто</button>
                <button type="button" id="btn-clear" class="tool-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>

        <button id="btn-submit" class="btn-blue">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Готово</span>
        </button>
        <div id="waiting-overlay" class="hidden" style="text-align: center; padding: 20px; color: #34d399; font-weight: 700;">
            Ответ отправлен! Ждём остальных игроков...
        </div>
    </div>

    <!-- 4. ФИНАЛЬНЫЙ АЛЬБОМ -->
    <div id="screen-results" class="card hidden">
        <div class="header-row">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Альбом игры</span>
        </div>
        <div id="album-title" style="text-align: center; font-weight: 700; color: #34d399;"></div>
        <div id="album-content" style="display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto;"></div>
        <div style="display: flex; gap: 10px;">
            <button id="btn-prev-chain" class="btn-gray">Назад</button>
            <button id="btn-next-chain" class="btn-blue">Далее</button>
        </div>
        <button id="btn-back-lobby" class="btn-green hidden">Сыграть ещё раз</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isHost = false;
        let currentRoundType = 'write';
        let allChains = [];
        let currentChainIdx = 0;

        const screens = {
            menu: document.getElementById('screen-menu'),
            lobby: document.getElementById('screen-lobby'),
            game: document.getElementById('screen-game'),
            results: document.getElementById('screen-results')
        };

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        // Создание и вход в комнату
        document.getElementById('btn-create').addEventListener('click', () => {
            const name = document.getElementById('input-name').value;
            socket.emit('createRoom', name, handleJoinResponse);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const name = document.getElementById('input-name').value;
            const roomCode = document.getElementById('input-code').value.trim();
            if (!roomCode) return document.getElementById('menu-error').textContent = 'Введите код комнаты!';
            socket.emit('joinRoom', { roomCode, playerName: name }, handleJoinResponse);
        });

        function handleJoinResponse(res) {
            if (res.error) {
                document.getElementById('menu-error').textContent = res.error;
                return;
            }
            isHost = res.isHost;
            document.getElementById('lobby-code').textContent = res.roomCode;
            renderLobby(res.players, isHost ? socket.id : null);
            showScreen('lobby');
        }

        function renderLobby(players, hostId) {
            isHost = (hostId === socket.id);
            document.getElementById('lobby-count').textContent = players.length;
            const list = document.getElementById('lobby-players');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.innerHTML = `<span>${p.name}</span>${p.id === hostId ? '<span class="badge">Создатель</span>' : ''}`;
                list.appendChild(li);
            });

            document.getElementById('btn-start').classList.toggle('hidden', !isHost);
            document.getElementById('lobby-wait-text').classList.toggle('hidden', isHost);
        }

        socket.on('updatePlayers', (data) => renderLobby(data.players, data.hostId));
        socket.on('gameError', (msg) => document.getElementById('lobby-error').textContent = msg);

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('lobby-error').textContent = '';
            socket.emit('startGame');
        });

        // Переход на новый раунд
        socket.on('nextRound', (data) => {
            currentRoundType = data.type;
            document.getElementById('round-num').textContent = data.round;
            document.getElementById('round-max').textContent = data.maxRounds;
            document.getElementById('wait-counter').textContent = '';

            document.getElementById('waiting-overlay').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');

            const modeWrite = document.getElementById('mode-write');
            const modeDraw = document.getElementById('mode-draw');

            if (data.type === 'write') {
                modeDraw.classList.add('hidden');
                modeWrite.classList.remove('hidden');
                document.getElementById('input-phrase').value = '';

                const imgEl = document.getElementById('img-to-guess');
                if (data.prompt) {
                    document.getElementById('write-instruction').textContent = 'Что нарисовано на картинке?';
                    imgEl.src = data.prompt;
                    imgEl.classList.remove('hidden');
                } else {
                    document.getElementById('write-instruction').textContent = 'Придумай слово или фразу:';
                    imgEl.classList.add('hidden');
                }
            } else {
                modeWrite.classList.add('hidden');
                modeDraw.classList.remove('hidden');
                document.getElementById('text-to-draw').textContent = data.prompt;
                clearCanvas();
            }

            showScreen('game');
        });

        socket.on('waitingStatus', (data) => {
            document.getElementById('wait-counter').textContent = `Готово: ${data.ready}/${data.total}`;
        });
        // ==========================================
        // ХОЛСТ ДЛЯ РИСОВАНИЯ ПАЛЬЦЕМ И МЫШЬЮ
        // ==========================================
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let brushColor = '#000000';
        let brushSize = 4;

        const colors = ['#000000', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#854d0e', '#ffffff'];
        const palette = document.getElementById('palette');
        colors.forEach((c, idx) => {
            const dot = document.createElement('div');
            dot.className = 'color-dot' + (idx === 0 ? ' active' : '');
            dot.style.background = c;
            if (c === '#ffffff') dot.style.border = '2px solid #94a3b8';
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                brushColor = c;
            });
            palette.appendChild(dot);
        });

        document.querySelectorAll('[data-size]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                brushSize = Number(btn.dataset.size);
            });
        });

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        clearCanvas();
        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function endDraw() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        // Отправка ответа на сервер
        document.getElementById('btn-submit').addEventListener('click', () => {
            let content = '';
            if (currentRoundType === 'write') {
                content = document.getElementById('input-phrase').value.trim();
                if (!content) return;
            } else {
                content = canvas.toDataURL('image/png', 0.8);
            }

            document.getElementById('mode-write').classList.add('hidden');
            document.getElementById('mode-draw').classList.add('hidden');
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('waiting-overlay').classList.remove('hidden');

            socket.emit('submitStep', content);
        });

        // ==========================================
        // АЛЬБОМ РЕЗУЛЬТАТОВ
        // ==========================================
        socket.on('showResults', (chains) => {
            allChains = chains;
            currentChainIdx = 0;
            renderChain();
            document.getElementById('btn-back-lobby').classList.toggle('hidden', !isHost);
            showScreen('results');
        });

        function renderChain() {
            const chain = allChains[currentChainIdx];
            document.getElementById('album-title').textContent = `Альбом игрока: ${chain.ownerName} (${currentChainIdx + 1}/${allChains.length})`;
            const container = document.getElementById('album-content');
            container.innerHTML = '';

            chain.steps.forEach(step => {
                const div = document.createElement('div');
                div.className = 'album-step';
                if (step.type === 'text') {
                    div.innerHTML = `<span class="author-tag">${step.author} написал(а):</span><div style="font-size: 16px; font-weight: 700;">${step.content}</div>`;
                } else {
                    div.innerHTML = `<span class="author-tag">${step.author} нарисовал(а):</span><img src="${step.content}" class="result-img">`;
                }
                container.appendChild(div);
            });
        }

        document.getElementById('btn-prev-chain').addEventListener('click', () => {
            if (currentChainIdx > 0) { currentChainIdx--; renderChain(); }
        });

        document.getElementById('btn-next-chain').addEventListener('click', () => {
            if (currentChainIdx < allChains.length - 1) { currentChainIdx++; renderChain(); }
        });

        document.getElementById('btn-back-lobby').addEventListener('click', () => socket.emit('restartLobby'));
        socket.on('backToLobby', (data) => {
            renderLobby(data.players, data.hostId);
            showScreen('lobby');
        });
    </script>
</body>
</html>
