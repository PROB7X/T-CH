<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram XONe — Отправка на сервер</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 12px; text-align: center; width: 300px; }
        input, button { margin-top: 15px; width: 100%; padding: 10px; border-radius: 6px; border: none; }
        button { background: #0088cc; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2>XONe Uploader</h2>
        <input type="file" id="fileInput">
        <button onclick="sendFile()">Отправить на сервак</button>
        <div id="status">Ожидание файла...</div>
    </div>

    <script>
        async function sendFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');

            if (!fileInput.files.length) {
                status.innerText = "Сначала выбери файл!";
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            status.innerText = "Отправка...";

            try {
                // Стучимся на твой сервер FirstByte на порт 5000
                const response = await fetch("https://sslip.io", {


                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                status.innerText = "Успех: " + result.message;
            } catch (error) {
                status.innerText = "Ошибка! Проверь, запущен ли сервер или разрешен ли HTTP.";
            }
        }
    </script>
</body>
</html>
