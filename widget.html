<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; font-family: sans-serif; user-select: none; }
  body { margin: 0; background: #111827; color: #f3f4f6; padding: 10px; font-size: 12px; overflow-y: auto; }
  .head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding-bottom: 6px; margin-bottom: 8px; }
  .title { font-weight: bold; color: #facc15; display: flex; align-items: center; gap: 6px; }
  .close-btn { background: #ef4444; border: none; color: #fff; border-radius: 4px; padding: 3px 8px; width: auto; margin: 0; cursor: pointer; }
  .sec { background: #1f2937; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
  .sec-t { font-size: 11px; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
  select, input, button { width: 100%; padding: 6px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #374151; background: #111827; color: #fff; font-size: 12px; }
  .row { display: flex; gap: 4px; }
  button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
  button.warn { background: #d97706; }
  button.danger { background: #dc2626; }
  button.ok { background: #059669; }
</style>
</head>
<body>
  <div class="head">
    <div class="title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      OWNER PANEL
    </div>
    <button class="close-btn" onclick="send({type:'closeWidget'})">X</button>
  </div>

  <div class="sec">
    <div class="sec-t">Цель (исключая HELM77ZX)</div>
    <select id="playerSelect"></select>
    <div class="row">
      <button class="warn" onclick="act('freeze')">Заморозка</button>
      <button class="danger" onclick="act('restrictAll')">Запретить всё</button>
    </div>
    <div class="row">
      <button onclick="act('tpTo')">ТП к игроку</button>
      <button class="warn" onclick="act('mute')">Мут</button>
    </div>
    <div class="row">
      <button class="danger" onclick="act('banRoom')">Бан (Комната)</button>
      <button class="danger" onclick="act('banGlobal')">Бан (Глобал)</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">Title-сообщение по центру</div>
    <input id="titleText" placeholder="Текст на экран (до 40 симв.)" maxlength="40">
    <div class="row">
      <button class="ok" onclick="sendTitle(false)">Игроку</button>
      <button class="warn" onclick="sendTitle(true)">Всем в комнате</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">Выдача предметов и амулетов</div>
    <div class="row">
      <select id="itemType">
        <option value="wood">Дерево</option>
        <option value="stone">Камень</option>
        <option value="brick">Кирпич</option>
        <option value="meat">Мясо</option>
        <option value="amulet_tp">Амулет ТП</option>
        <option value="amulet_swap">Амулет Обмена</option>
      </select>
      <input id="itemAmt" type="number" value="5" min="1" max="99" style="width:65px">
    </div>
    <button class="ok" onclick="giveItem()">Выдать игроку</button>
  </div>

  <div class="sec">
    <div class="sec-t">Лаки-блоки и мир</div>
    <div class="row">
      <input id="lbCount" type="number" value="5" min="1" max="30" placeholder="Кол-во">
      <input id="lbLuck" type="number" value="60" min="0" max="100" placeholder="Удача %">
    </div>
    <button class="warn" onclick="spawnLucky()">Заспавнить Лаки-блоки</button>
    <div class="row">
      <select id="weatherSel">
        <option value="clear">Ясно</option>
        <option value="rain">Дождь</option>
        <option value="storm">Ураган</option>
        <option value="speed">Бафф скорости</option>
      </select>
      <button onclick="setWeather()">Погода</button>
    </div>
    <button onclick="send({type:'adminCmd', cmd:{action:'toggleRoom', roomId:'ob.timeos.op'}})">Открыть/Закрыть ob.timeos.op</button>
  </div>

<script>
  function send(data) { window.parent.postMessage(data, '*'); }
  function getTarget() { return document.getElementById('playerSelect').value; }
  function act(action) {
    const target = getTarget();
    if (!target || target === 'HELM77ZX') return;
    send({ type: 'adminCmd', cmd: { action, target } });
  }
  function sendTitle(all) {
    const text = document.getElementById('titleText').value.trim();
    if (!text) return;
    const target = all ? 'ALL' : getTarget();
    if (!target) return;
    send({ type: 'adminCmd', cmd: { action: 'title', target, text } });
    document.getElementById('titleText').value = '';
  }
  function giveItem() {
    const target = getTarget();
    if (!target) return;
    send({ type: 'adminCmd', cmd: { action: 'give', target, item: document.getElementById('itemType').value, amount: document.getElementById('itemAmt').value } });
  }
  function spawnLucky() {
    send({ type: 'adminCmd', cmd: { action: 'spawnLucky', count: document.getElementById('lbCount').value, luck: document.getElementById('lbLuck').value } });
  }
  function setWeather() {
    send({ type: 'adminCmd', cmd: { action: 'weather', weather: document.getElementById('weatherSel').value } });
  }
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'updatePlayers') {
      const sel = document.getElementById('playerSelect');
      const prev = sel.value;
      sel.innerHTML = '';
      (e.data.players || []).filter(n => n !== 'HELM77ZX').forEach(nick => {
        const opt = document.createElement('option');
        opt.value = nick; opt.textContent = nick;
        sel.appendChild(opt);
      });
      if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
    }
  });
</script>
</body>
</html>
