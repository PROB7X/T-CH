<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онлайн Червячки</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; user-select: none; }
        body { margin: 0; overflow: hidden; background: #121212; color: white; touch-action: none; }
        canvas#game { display: block; }
        
        #fsOverlay {
            position: fixed; inset: 0; background: rgba(10, 10, 10, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center; padding: 20px;
        }
        #fsOverlay p { color: #aaa; margin-bottom: 20px; font-size: 16px; }
        #fsBtn {
            padding: 16px 32px; font-size: 20px; font-weight: bold; border-radius: 12px;
            border: none; background: #2196f3; color: white; cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
        }

        #menu {
            position: fixed; inset: 0; background: rgba(18, 18, 18, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        #menu h1 { font-size: 28px; color: #4caf50; margin: 0 0 15px 0; text-shadow: 0 0 10px rgba(76,175,80,0.5); }
        #menu input {
            padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 2px solid #333;
            background: #222; color: white; text-align: center; margin-bottom: 12px; width: 240px; outline: none;
        }
        #menu input:focus { border-color: #4caf50; }
        #menu button {
            padding: 10px 36px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none;
            background: #4caf50; color: white; cursor: pointer;
        }

        #hud { display: none; position: fixed; inset: 0; pointer-events: none; }
        
        /* Левый верхний угол: статистика и миникарта */
        #topLeft { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px; }
        #stats { background: rgba(0,0,0,0.65); padding: 7px 12px; border-radius: 8px; font-size: 14px; width: fit-content; }
        #minimap {
            width: 110px; height: 110px; background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 8px;
        }

        /* Фиксированная таблица лидеров (не дергается) */
        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65);
            padding: 8px 12px; border-radius: 8px; font-size: 13px;
            width: 170px; height: 122px; overflow: hidden;
        }
        .top-row {
            display: flex; justify-content: space-between; margin-top: 3px;
            white-space: nowrap; overflow: hidden;
        }
        .top-name { overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
        
        #joyBase {
            position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
        }
        #joyStick {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(76, 175, 80, 0.85); box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative; pointer-events: none;
        }

        #boostBtn {
            position: absolute; bottom: 25px; right: 25px; width: 90px; height: 90px;
            border-radius: 50%; background: rgba(255, 152, 0, 0.25);
            border: 2px solid rgba(255, 152, 0, 0.7); color: white; font-size: 32px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; cursor: pointer; transition: 0.1s;
        }
        #boostBtn.active {
            background: rgba(255, 152, 0, 0.75); transform: scale(0.92);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="fsOverlay">
        <p>Для удобного управления переведите игру в горизонтальный полноэкранный режим</p>
        <button id="fsBtn">📱 На весь экран</button>
    </div>

    <div id="menu">
        <h1>🐛 Червячки Онлайн</h1>
        <input type="text" id="nickInput" placeholder="Введи имя..." maxlength="15">
        <button id="playBtn">Играть</button>
    </div>

    <div id="hud">
        <div id="topLeft">
            <div id="stats">Вес: <b id="massVal">10</b> | Онлайн: <b id="onlineVal">1</b></div>
            <canvas id="minimap" width="110" height="110"></canvas>
        </div>
        <div id="leaderboard"><b>Топ игроков:</b><div id="topList"></div></div>
        <div id="joyBase"><div id="joyStick"></div></div>
        <div id="boostBtn">🚀</div>
    </div>

    <canvas id="game"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimap');
        const miniCtx = miniCanvas.getContext('2d');
        const fsOverlay = document.getElementById('fsOverlay');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        async function enterFullscreen() {
            try {
                const el = document.documentElement;
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}
            fsOverlay.style.display = 'none';
            resize();
        }
        document.getElementById('fsBtn').onclick = enterFullscreen;

        function checkFullscreen() {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            fsOverlay.style.display = isFs ? 'none' : 'flex';
            resize();
        }
        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
        let myId = null;
        let mapSize = 2000;
        let playing = false;
        let players = {};
        let foods = [];

        let myData = { name: 'Игрок', color: '#4caf50', mass: 10 };
        let myPos = { x: 1000, y: 1000 };
        let angle = 0;
        let tail = [];
        let isBoosting = false;

        const joyBase = document.getElementById('joyBase');
        const joyStick = document.getElementById('joyStick');
        let joyTouchId = null;

        function handleJoyMove(clientX, clientY) {
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 35;

            if (dist > 2) angle = Math.atan2(dy, dx);

            const clampedDist = Math.min(dist, maxRadius);
            joyStick.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
        }

        joyBase.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joyTouchId === null && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
                handleJoyMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (joyTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    handleJoyMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                }
            }
        }, { passive: false });

        function resetJoy(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    joyStick.style.transform = `translate(0px, 0px)`;
                }
            }
        }
        window.addEventListener('touchend', resetJoy);
        window.addEventListener('touchcancel', resetJoy);

        const boostBtn = document.getElementById('boostBtn');
        function setBoost(state) {
            isBoosting = state;
            boostBtn.classList.toggle('active', state);
        }
        boostBtn.addEventListener('touchstart', e => { e.preventDefault(); setBoost(true); }, { passive: false });
        boostBtn.addEventListener('touchend', e => { e.preventDefault(); setBoost(false); }, { passive: false });
        boostBtn.addEventListener('touchcancel', () => setBoost(false));
        boostBtn.addEventListener('mousedown', () => setBoost(true));
        window.addEventListener('mouseup', () => setBoost(false));
        window.addEventListener('keydown', e => { if (e.code === 'Space') setBoost(true); });
        window.addEventListener('keyup', e => { if (e.code === 'Space') setBoost(false); });

        window.addEventListener('mousemove', e => {
            if (playing && joyTouchId === null) {
                angle = Math.atan2(e.clientY - canvas.height / 2, e.clientX - canvas.width / 2);
            }
        });

        document.getElementById('playBtn').onclick = () => {
            const nick = document.getElementById('nickInput').value.trim() || 'Игрок';
            myData.name = nick;
            socket.emit('join', nick);
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            playing = true;
        };
        socket.on('init', data => {
            myId = data.id;
            mapSize = data.mapSize || 2000;
            if (Array.isArray(data.foods)) foods = data.foods;
            if (data.player) {
                myData = data.player;
                myPos.x = data.player.x;
                myPos.y = data.player.y;
                tail = [];
            }
        });

        socket.on('foods', serverFoods => {
            if (Array.isArray(serverFoods)) foods = serverFoods;
        });

        socket.on('state', serverPlayers => {
            players = serverPlayers || {};
            const myServerId = myId || socket.id;
            if (myServerId && players[myServerId]) {
                myData.mass = players[myServerId].mass || 10;
                myData.color = players[myServerId].color || myData.color;
                myData.name = players[myServerId].name || myData.name;
            }
            document.getElementById('massVal').innerText = myData.mass;

            const list = Object.values(players);
            document.getElementById('onlineVal').innerText = Math.max(1, list.length);

            list.sort((a, b) => (b.mass || 10) - (a.mass || 10));
            document.getElementById('topList').innerHTML = list.slice(0, 5)
                .map((p, i) => `<div class="top-row"><span class="top-name">${i + 1}. ${p.name || 'Игрок'}</span><b>${p.mass || 10}</b></div>`).join('');
        });

        function update() {
            if (!playing) return;

            const speed = isBoosting ? 6.2 : 3.2;
            myPos.x += Math.cos(angle) * speed;
            myPos.y += Math.sin(angle) * speed;

            myPos.x = Math.max(15, Math.min(mapSize - 15, myPos.x));
            myPos.y = Math.max(15, Math.min(mapSize - 15, myPos.y));

            tail.push({ x: myPos.x, y: myPos.y });
            const maxTail = Math.min(200, 12 + Math.floor(myData.mass * 0.8));
            while (tail.length > maxTail) tail.shift();

            socket.emit('update', {
                name: myData.name,
                color: myData.color,
                x: myPos.x,
                y: myPos.y,
                tail: tail,
                boosting: isBoosting
            });
        }

        function isVisible(x, y, margin, view) {
            return x >= view.left - margin && x <= view.right + margin &&
                   y >= view.top - margin && y <= view.bottom + margin;
        }

        function drawWorm(x, y, t, color, name, mass, view) {
            const radius = Math.min(28, 11 + mass * 0.05);
            const margin = radius + 80;

            // Хвост всегда одного размера с головой (без уменьшения к концу)
            if (t && t.length > 0) {
                ctx.fillStyle = color;
                for (let i = 0; i < t.length; i++) {
                    if (isVisible(t[i].x, t[i].y, margin, view)) {
                        ctx.beginPath();
                        ctx.arc(t[i].x, t[i].y, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            if (isVisible(x, y, margin, view)) {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${name} (${mass})`, x, y - radius - 8);
            }
        }

        function drawMinimap() {
            const w = miniCanvas.width;
            const h = miniCanvas.height;
            miniCtx.clearRect(0, 0, w, h);

            const myServerId = myId || socket.id;

            // Остальные игроки на миникарте (цветные точки)
            for (let id in players) {
                if (id !== myServerId) {
                    const p = players[id];
                    if (p && typeof p.x === 'number') {
                        const mx = (p.x / mapSize) * w;
                        const my = (p.y / mapSize) * h;
                        miniCtx.beginPath();
                        miniCtx.arc(mx, my, 3.5, 0, Math.PI * 2);
                        miniCtx.fillStyle = p.color || '#ff5252';
                        miniCtx.fill();
                    }
                }
            }

            // Мы сами на миникарте (яркая белая точка)
            if (playing) {
                const mx = (myPos.x / mapSize) * w;
                const my = (myPos.y / mapSize) * h;
                miniCtx.beginPath();
                miniCtx.arc(mx, my, 4, 0, Math.PI * 2);
                miniCtx.fillStyle = '#ffffff';
                miniCtx.fill();
            }
        }

        function draw() {
            ctx.fillStyle = '#161616';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const view = {
                left: myPos.x - canvas.width / 2,
                right: myPos.x + canvas.width / 2,
                top: myPos.y - canvas.height / 2,
                bottom: myPos.y + canvas.height / 2
            };

            ctx.save();
            ctx.translate(-view.left, -view.top);

            ctx.strokeStyle = '#242424';
            ctx.lineWidth = 1;
            const startX = Math.max(0, Math.floor(view.left / 50) * 50);
            const endX = Math.min(mapSize, Math.ceil(view.right / 50) * 50);
            const startY = Math.max(0, Math.floor(view.top / 50) * 50);
            const endY = Math.min(mapSize, Math.ceil(view.bottom / 50) * 50);

            for (let x = startX; x <= endX; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
            }
            for (let y = startY; y <= endY; y += 50) {
                ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
            }

            ctx.strokeStyle = '#ff5252';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, mapSize, mapSize);

            for (let i = 0; i < foods.length; i++) {
                const f = foods[i];
                if (isVisible(f.x, f.y, 50, view)) {
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.value > 1 ? 9 : 5, 0, Math.PI * 2);
                    ctx.fillStyle = f.color;
                    ctx.fill();
                }
            }

            const myServerId = myId || socket.id;
            for (let id in players) {
                if (id !== myServerId) {
                    const p = players[id];
                    if (p && typeof p.x === 'number') {
                        drawWorm(p.x, p.y, p.tail, p.color || '#448aff', p.name || 'Игрок', p.mass || 10, view);
                    }
                }
            }

            if (playing) {
                drawWorm(myPos.x, myPos.y, tail, myData.color, myData.name, myData.mass, view);
            }

            ctx.restore();
            drawMinimap();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
