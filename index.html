<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InDeathPet</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #090b10;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fsOverlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 11, 16, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn-main {
            background: #111622;
            color: #00ffaa;
            border: 2px solid #00ffaa;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-main:hover:not(:disabled) { background: #00ffaa; color: #090b10; }
        .btn-main:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-danger { border-color: #f43f5e; color: #f43f5e; }
        .btn-danger:hover:not(:disabled) { background: #f43f5e; color: #fff; }

        .game-container {
            width: 96vw;
            height: 92vh;
            background: #11151f;
            border: 1px solid #262f40;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 14px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #262f40;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .logo { color: #00ffaa; font-weight: 900; font-size: 20px; letter-spacing: 2px; }
        .hidden { display: none !important; }

        #loginScreen {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        input {
            background: #090b10;
            border: 1px solid #262f40;
            color: #fff;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 6px;
            width: 280px;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #00ffaa; }

        .lobby-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
            align-items: center;
        }

        .panel {
            background: #0c0f17;
            border: 1px solid #1e2636;
            border-radius: 10px;
            height: 100%;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .pet-svg-box { width: 130px; height: 130px; }
        .rarity-ОБЫЧНЫЙ { color: #94a3b8; }
        .rarity-РЕДКИЙ { color: #38bdf8; }
        .rarity-МИФИЧЕСКИЙ { color: #f43f5e; }

        .arena-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            flex: 1;
        }
        .hp-bar { width: 100%; height: 12px; background: #1e2636; border-radius: 6px; overflow: hidden; margin-top: 6px; }
        .hp-fill { height: 100%; background: #00ffaa; transition: width 0.3s; }
        .moves-row { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
        .status-line { font-size: 13px; color: #94a3b8; text-align: center; min-height: 20px; }
    </style>
</head>
<body>
    <div id="fsOverlay">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00ffaa" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <div style="letter-spacing: 1px; color: #94a3b8;">ДЛЯ ИГРЫ ТРЕБУЕТСЯ ГОРИЗОНТАЛЬНЫЙ ПОЛНОЭКРАННЫЙ РЕЖИМ</div>
        <button class="btn-main" onclick="enterFullScreen()">НА ВЕСЬ ЭКРАН</button>
    </div>

    <div class="game-container">
        <div class="header">
            <div class="logo">INDEATHPET</div>
            <div id="topStats" class="hidden" style="font-size: 14px; color: #94a3b8;">
                БОЕЦ: <b id="playerName" style="color:#fff;"></b> | ПОБЕД: <b id="playerWins" style="color:#00ffaa;">0</b>
            </div>
        </div>

        <div id="loginScreen">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#00ffaa" stroke-width="1.8">
                <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <div style="font-size: 18px; font-weight: bold; letter-spacing: 1px;">ВВЕДИТЕ ВАШ НИКНЕЙМ</div>
            <input type="text" id="usernameInput" placeholder="НИКНЕЙМ..." maxlength="16">
            <button class="btn-main" onclick="login()">ВОЙТИ В СИСТЕМУ</button>
        </div>

        <div id="eggScreen" class="hidden" style="margin:auto; text-align:center;">
            <svg width="100" height="120" viewBox="0 0 100 120">
                <path d="M50 10 C80 10 90 55 90 80 C90 102 72 112 50 112 C28 112 10 102 10 80 C10 55 20 10 50 10 Z" fill="#161d2b" stroke="#00ffaa" stroke-width="3"/>
                <polyline points="35,55 48,68 42,82 58,92" fill="none" stroke="#00ffaa" stroke-width="2.5"/>
            </svg>
            <p style="color:#94a3b8;">ОБНАРУЖЕНА НЕИЗВЕСТНАЯ КАПСУЛА. ИНИЦИИРУЙТЕ ВЫЛУПЛЕНИЕ.</p>
            <button class="btn-main" onclick="socket.emit('openEgg')">ОТКРЫТЬ ЯЙЦО</button>
        </div>

        <div id="lobbyScreen" class="lobby-grid hidden">
            <div class="panel">
                <div style="text-align:center;">
                    <div id="petType" style="font-weight:bold; font-size:18px;"></div>
                    <div id="petRarity" style="font-size:12px; letter-spacing:1px;"></div>
                </div>

                <div id="petSvgContainer" class="pet-svg-box"></div>

                <div style="font-size:14px; color:#94a3b8;">
                    УРОВЕНЬ: <b id="petLvl" style="color:#fff;">1</b> | МАКС. HP: <b id="petHp" style="color:#00ffaa;">100</b>
                </div>

                <div id="trainStatus" style="font-size:12px; color:#fbbf24; min-height:16px;"></div>

                <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                    <button class="btn-main" id="trainBtn" style="padding:10px 14px; font-size:13px;" onclick="socket.emit('toggleTraining')">AFK-ТРЕНИРОВКА</button>
                    <button class="btn-main" style="padding:10px 14px; font-size:13px;" onclick="socket.emit('findBattle')">В БОЙ (PVP)</button>
                    <button class="btn-main btn-danger" style="padding:10px 12px; font-size:12px;" onclick="socket.emit('openEgg')">НОВОЕ ЯЙЦО</button>
                </div>
            </div>

            <div class="panel">
                <div style="font-size:13px; letter-spacing:1px; color:#94a3b8;">ШЕСТИГРАННИК ХАРАКТЕРИСТИК</div>
                <svg id="hexRadar" width="240" height="210" viewBox="0 0 240 210"></svg>
                <div id="statsLegend" style="font-size:11px; color:#94a3b8; text-align:center;"></div>
            </div>
        </div>

        <div id="battleScreen" class="hidden" style="display:flex; flex-direction:column; flex:1; justify-content:space-between;">
            <div class="arena-grid">
                <div class="panel">
                    <b id="bP1Name">ИГРОК 1</b>
                    <div id="bP1Svg" style="width:90px; height:90px;"></div>
                    <div style="width:100%;">
                        <div style="font-size:12px;">HP: <span id="bP1HpText">100/100</span></div>
                        <div class="hp-bar"><div id="bP1HpBar" class="hp-fill"></div></div>
                    </div>
                </div>

                <div style="font-size:24px; font-weight:900; color:#f43f5e;">VS</div>

                <div class="panel">
                    <b id="bP2Name">ИГРОК 2</b>
                    <div id="bP2Svg" style="width:90px; height:90px;"></div>
                    <div style="width:100%;">
                        <div style="font-size:12px;">HP: <span id="bP2HpText">100/100</span></div>
                        <div class="hp-bar"><div id="bP2HpBar" class="hp-fill"></div></div>
                    </div>
                </div>
            </div>

            <div class="moves-row">
                <button class="btn-main moveBtn" onclick="sendMove('flame')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"/></svg>
                    ПЛАМЯ
                </button>
                <button class="btn-main moveBtn" onclick="sendMove('shield')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    ЩИТ
                </button>
                <button class="btn-main moveBtn" onclick="sendMove('power')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    СИЛА
                </button>
                <button id="backLobbyBtn" class="btn-main hidden" onclick="backToLobby()">В ЛОББИ</button>
            </div>
        </div>

        <div class="status-line" id="statusMsg">СИСТЕМА ГОТОВА</div>
    </div>
    <script>
        const socket = io();
        let userData = null;
        let currentRoom = null;
        let trainInterval = null;

        const PET_SVGS = {
            lizard: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <polygon points="20,75 40,35 75,30 85,50 65,75" fill="#16222f" stroke="#94a3b8" stroke-width="3"/>
                <polygon points="45,35 52,18 60,33" fill="#94a3b8"/>
                <circle cx="70" cy="43" r="4" fill="#00ffaa"/>
            </svg>`,
            dragon: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <polygon points="15,65 35,20 55,40 85,25 75,70 45,80" fill="#122338" stroke="#38bdf8" stroke-width="3"/>
                <polygon points="35,20 20,10 42,15" fill="#38bdf8"/>
                <circle cx="68" cy="42" r="4" fill="#f43f5e"/>
            </svg>`,
            mutant: `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <polygon points="50,12 85,35 78,82 22,82 15,35" fill="#261220" stroke="#f43f5e" stroke-width="3"/>
                <polygon points="35,45 45,38 45,52" fill="#00ffaa"/>
                <polygon points="65,45 55,38 55,52" fill="#00ffaa"/>
                <line x1="35" y1="68" x2="65" y2="68" stroke="#f43f5e" stroke-width="3"/>
            </svg>`
        };

        async function enterFullScreen() {
            const el = document.documentElement;
            try {
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();

                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}
            checkFullScreen();
        }

        function checkFullScreen() {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            const overlay = document.getElementById('fsOverlay');
            if (isFs) overlay.classList.add('hidden');
            else overlay.classList.remove('hidden');
        }

        document.addEventListener('fullscreenchange', checkFullScreen);
        document.addEventListener('webkitfullscreenchange', checkFullScreen);

        function drawHexagonStats(stats) {
            const svg = document.getElementById('hexRadar');
            const cx = 120, cy = 105, maxR = 72;
            const keys = [
                { k: 'str', label: 'СИЛ' },
                { k: 'vit', label: 'ЖИВ' },
                { k: 'def', label: 'БРО' },
                { k: 'spd', label: 'СКО' },
                { k: 'int', label: 'ИНТ' },
                { k: 'rage', label: 'ЯРО' }
            ];

            let html = '';
            [0.33, 0.66, 1].forEach(scale => {
                const pts = keys.map((_, i) => {
                    const angle = (Math.PI / 3) * i - Math.PI / 2;
                    return `${cx + maxR * scale * Math.cos(angle)},${cy + maxR * scale * Math.sin(angle)}`;
                }).join(' ');
                html += `<polygon points="${pts}" fill="none" stroke="#262f40" stroke-width="1"/>`;
            });

            const statPts = keys.map((item, i) => {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const xEnd = cx + maxR * Math.cos(angle);
                const yEnd = cy + maxR * Math.sin(angle);
                const xLbl = cx + (maxR + 22) * Math.cos(angle);
                const yLbl = cy + (maxR + 16) * Math.sin(angle) + 4;

                html += `<line x1="${cx}" y1="${cy}" x2="${xEnd}" y2="${yEnd}" stroke="#1e2636" stroke-width="1"/>`;
                html += `<text x="${xLbl}" y="${yLbl}" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="bold">${item.label}:${stats[item.k]}</text>`;

                const valRatio = Math.min(1, (stats[item.k] || 10) / 100);
                return `${cx + maxR * valRatio * Math.cos(angle)},${cy + maxR * valRatio * Math.sin(angle)}`;
            }).join(' ');

            html += `<polygon points="${statPts}" fill="rgba(0, 255, 170, 0.25)" stroke="#00ffaa" stroke-width="2"/>`;
            svg.innerHTML = html;
        }

        function login() {
            const name = document.getElementById('usernameInput').value;
            if (!name.trim()) return;
            socket.emit('login', name);
        }

        socket.on('msg', (text) => {
            document.getElementById('statusMsg').innerText = text;
        });

        socket.on('userData', (data) => {
            userData = data;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('topStats').classList.remove('hidden');
            document.getElementById('playerName').innerText = data.name;
            document.getElementById('playerWins').innerText = data.wins;

            if (!data.pet) {
                document.getElementById('eggScreen').classList.remove('hidden');
                document.getElementById('lobbyScreen').classList.add('hidden');
            } else {
                document.getElementById('eggScreen').classList.add('hidden');
                document.getElementById('lobbyScreen').classList.remove('hidden');

                document.getElementById('petType').innerText = data.pet.type;
                const rar = document.getElementById('petRarity');
                rar.innerText = data.pet.rarity;
                rar.className = 'rarity-' + data.pet.rarity;

                document.getElementById('petSvgContainer').innerHTML = PET_SVGS[data.pet.svgKey];
                document.getElementById('petLvl').innerText = data.pet.level;
                document.getElementById('petHp').innerText = data.pet.maxHp;

                drawHexagonStats(data.pet.stats);

                clearInterval(trainInterval);
                const trainBtn = document.getElementById('trainBtn');
                const trainStatus = document.getElementById('trainStatus');

                if (data.trainingStart) {
                    trainBtn.innerText = 'ЗАБРАТЬ С ТРЕНИРОВКИ';
                    trainInterval = setInterval(() => {
                        const sec = Math.floor((Date.now() - data.trainingStart) / 1000);
                        const gain = Math.floor(sec / 5);
                        trainStatus.innerText = `ТРЕНИРОВКА: ${sec} СЕК (+${gain} КО ВСЕМ ГРАНЯМ)`;
                    }, 1000);
                } else {
                    trainBtn.innerText = 'AFK-ТРЕНИРОВКА';
                    trainStatus.innerText = 'ГОТОВ К БОЮ';
                }
            }
        });

        socket.on('battleStart', (b) => {
            currentRoom = b.roomId;
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('battleScreen').classList.remove('hidden');
            document.getElementById('backLobbyBtn').classList.add('hidden');
            document.getElementById('statusMsg').innerText = 'БОЙ НАЧАЛСЯ. ВЫБЕРИТЕ СПОСОБНОСТЬ.';
            enableMoves(true);
            updateBattleUI(b);
        });

        socket.on('battleUpdate', ({ log, battle }) => {
            document.getElementById('statusMsg').innerText = log;
            enableMoves(true);
            updateBattleUI(battle);
        });

        socket.on('battleEnd', ({ winner, log, battle }) => {
            updateBattleUI(battle);
            document.getElementById('statusMsg').innerText = `${log} | ПОБЕДИТЕЛЬ: ${winner}`;
            enableMoves(false);
            document.getElementById('backLobbyBtn').classList.remove('hidden');
        });

        function updateBattleUI(b) {
            document.getElementById('bP1Name').innerText = b.p1.name;
            document.getElementById('bP1Svg').innerHTML = PET_SVGS[b.p1.pet.svgKey];
            document.getElementById('bP1HpText').innerText = `${b.p1.hp}/${b.p1.pet.maxHp}`;
            document.getElementById('bP1HpBar').style.width = `${(b.p1.hp / b.p1.pet.maxHp) * 100}%`;

            document.getElementById('bP2Name').innerText = b.p2.name;
            document.getElementById('bP2Svg').innerHTML = PET_SVGS[b.p2.pet.svgKey];
            document.getElementById('bP2HpText').innerText = `${b.p2.hp}/${b.p2.pet.maxHp}`;
            document.getElementById('bP2HpBar').style.width = `${(b.p2.hp / b.p2.pet.maxHp) * 100}%`;
        }

        function sendMove(move) {
            enableMoves(false);
            document.getElementById('statusMsg').innerText = 'ОЖИДАНИЕ ХОДА ПРОТИВНИКА...';
            socket.emit('battleMove', { roomId: currentRoom, move });
        }

        function enableMoves(state) {
            document.querySelectorAll('.moveBtn').forEach(btn => btn.disabled = !state);
        }

        function backToLobby() {
            document.getElementById('battleScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            socket.emit('login', userData.name);
        }
    </script>
</body>
</html>
