<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram XONe — Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0e1621; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #17212b; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0b1118; }
        header h1 { font-size: 18px; color: #fff; }
        #nickInput { background: #242f3d; border: none; color: #6ab2f2; padding: 6px 10px; border-radius: 8px; width: 120px; font-weight: bold; outline: none; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #182533; padding: 10px 14px; border-radius: 12px; max-width: 80%; align-self: flex-start; word-wrap: break-word; }
        .msg.mine { background: #2b5278; align-self: flex-end; }
        .msg-header { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #6ab2f2; margin-bottom: 4px; font-weight: bold; }
        .msg.mine .msg-header { color: #8ec5fc; }
        .msg-time { color: #6c7883; font-weight: normal; font-size: 11px; }
        .msg-text { font-size: 15px; line-height: 1.4; }
        footer { background: #17212b; padding: 10px; display: flex; gap: 8px; }
        #textInput { flex: 1; background: #242f3d; border: none; color: #fff; padding: 12px 14px; border-radius: 20px; font-size: 15px; outline: none; }
        button { background: #5288c1; color: #fff; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:active { background: #4170a3; }
    </style>
</head>
<body>
    <header>
        <h1>Telegram XONe</h1>
        <input type="text" id="nickInput" placeholder="Твой ник" value="Геймдизайнер">
    </header>

    <div id="chat"></div>

    <footer>
        <input type="text" id="textInput" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">➤</button>
    </footer>

    <script>
        const API_URL = "https://sslip.io";
        const chatBox = document.getElementById("chat");
        const nickInput = document.getElementById("nickInput");
        const textInput = document.getElementById("textInput");
        let lastCount = 0;

        // Запоминаем ник в памяти браузера
        if (localStorage.getItem("xone_nick")) {
            nickInput.value = localStorage.getItem("xone_nick");
        }
        nickInput.addEventListener("input", () => localStorage.setItem("xone_nick", nickInput.value));

        async function loadMessages() {
            try {
                const res = await fetch(API_URL);
                const msgs = await res.json();
                if (msgs.length !== lastCount) {
                    const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 60;
                    chatBox.innerHTML = "";
                    msgs.forEach(m => {
                        const div = document.createElement("div");
                        const isMine = m.user === (nickInput.value.trim() || "Аноним");
                        div.className = "msg" + (isMine ? " mine" : "");
                        div.innerHTML = `
                            <div class="msg-header">
                                <span>${escapeHtml(m.user)}</span>
                                <span class="msg-time">${m.time}</span>
                            </div>
                            <div class="msg-text">${escapeHtml(m.text)}</div>
                        `;
                        chatBox.appendChild(div);
                    });
                    if (isAtBottom || lastCount === 0) {
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                    lastCount = msgs.length;
                }
            } catch (e) {
                console.error("Ошибка загрузки чата:", e);
            }
        }

        async function sendMsg() {
            const text = textInput.value.trim();
            const user = nickInput.value.trim() || "Аноним";
            if (!text) return;

            textInput.value = "";
            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user, text })
                });
                loadMessages();
            } catch (e) {
                alert("Не удалось отправить сообщение. Проверь сервер!");
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        loadMessages();
        setInterval(loadMessages, 2000);
    </script>
</body>
</html>
