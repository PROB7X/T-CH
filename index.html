<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TX — Общий чат</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1e1e1e;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        header h1 { margin: 0; font-size: 18px; }
        header small { color: #ff6b6b; font-size: 12px; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            background: #252525;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .msg b { color: #4dabf7; display: block; font-size: 13px; margin-bottom: 4px; }
        .msg span { font-size: 15px; }
        .msg time { font-size: 10px; color: #888; float: right; margin-left: 10px; margin-top: 4px; }
        form {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #1e1e1e;
            border-top: 1px solid #333;
        }
        input {
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        #nick { width: 100px; }
        #text { flex: 1; }
        button {
            background: #339af0;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #1c7ed6; }
    </style>
</head>
<body>

<header>
    <h1>TX — Общий чат</h1>
    <small>История автоматически очищается каждые 5 минут</small>
</header>

<div id="chat"></div>

<form id="form">
    <input type="text" id="nick" placeholder="Никнейм" maxlength="15" required>
    <input type="text" id="text" placeholder="Сообщение..." maxlength="300" required autocomplete="off">
    <button type="submit">➤</button>
</form>

<script>
    // Адрес вашего сервера в Финляндии
    const SERVER_URL = "http://103.82.102.226:8080";

    const chatBox = document.getElementById('chat');
    const form = document.getElementById('form');
    const nickInput = document.getElementById('nick');
    const textInput = document.getElementById('text');

    // Сохраняем ник в браузере, чтобы не вводить каждый раз
    nickInput.value = localStorage.getItem('tx_nick') || '';

    let lastCount = -1;

    // Загрузка сообщений с сервера
    async function loadMessages() {
        try {
            const res = await fetch(SERVER_URL + '/messages');
            const messages = await res.json();

            if (messages.length !== lastCount) {
                lastCount = messages.length;
                chatBox.innerHTML = '';
                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'msg';
                    div.innerHTML = `<b>${escapeHtml(m.nick)}</b><span>${escapeHtml(m.text)}</span><time>${m.time}</time>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (e) {
            console.log("Ожидание ответа от сервера...");
        }
    }

    // Отправка сообщения на сервер
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nick = nickInput.value.trim();
        const text = textInput.value.trim();
        if (!nick || !text) return;

        localStorage.setItem('tx_nick', nick);
        textInput.value = '';

        await fetch(SERVER_URL + '/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nick, text })
        });
        loadMessages();
    });

    // Защита от вставки чужого HTML-кода в сообщения
    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[tag]));
    }

    // Проверяем новые сообщения каждую секунду
    setInterval(loadMessages, 1000);
    loadMessages();
</script>

</body>
</html>
