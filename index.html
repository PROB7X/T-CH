<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sketch Relay 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #1e1b4b; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px; }
        .card { background: #312e81; border: 1px solid #4338ca; border-radius: 16px; padding: 18px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 12px; }
        .hidden { display: none !important; }
        .header-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 800; color: #a5b4fc; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #4f46e5; background: #1e1b4b; color: white; font-size: 15px; outline: none; }
        input:focus { border-color: #818cf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-green { background: #10b981; }
        .btn-orange { background: #f59e0b; }
        .btn-blue { background: #3b82f6; }
        .btn-red { background: #ef4444; width: auto; padding: 8px 12px; font-size: 13px; }
        .btn-gray { background: #475569; }
        .error { color: #fca5a5; font-size: 13px; text-align: center; min-height: 16px; }
        .player-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
        .player-item { background: #1e1b4b; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .badge { background: #4f46e5; padding: 3px 8px; border-radius: 6px; font-size: 11px; }

        /* Выбор режима в лобби (SVG + текст снизу) */
        .modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-card { background: #1e1b4b; border: 2px solid #4f46e5; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; text-align: center; transition: 0.15s; }
        .mode-card.active { border-color: #10b981; background: rgba(16, 185, 129, 0.18); }
        .mode-card.disabled { pointer-events: none; opacity: 0.85; }
        .mode-card span { font-size: 13px; font-weight: 700; }

        /* Холст и инструменты */
        #draw-canvas { background: #ffffff; border-radius: 12px; width: 100%; aspect-ratio: 4 / 3; touch-action: none; cursor: crosshair; display: block; border: 3px solid #4f46e5; }
        .tools-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; }
        .tool-icon-btn { width: 38px; height: 38px; padding: 0; border-radius: 8px; background: #1e1b4b; border: 1px solid #4f46e5; }
        .tool-icon-btn.active { background: #4f46e5; border-color: #a5b4fc; }
        .size-btn { width: auto; padding: 6px 10px; font-size: 12px; background: #1e1b4b; border: 1px solid #4f46e5; }
        .size-btn.active { background: #4f46e5; }

        /* Палитра: круг, HEX, готовые цвета */
        .color-controls { display: flex; align-items: center; gap: 6px; background: #1e1b4b; padding: 8px; border-radius: 10px; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; background: none; cursor: pointer; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }
        #hex-input { width: 82px; padding: 6px 8px; font-size: 13px; font-family: monospace; text-transform: uppercase; }
        .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-dot.active { border-color: #ffffff; transform: scale(1.15); }

        /* Итоги и таймер */
        .timer-pill { background: #ef4444; padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 800; color: white; }
        .prompt-box { background: #1e1b4b; padding: 12px; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 700; border: 1px dashed #818cf8; }
        .result-img { width: 100%; border-radius: 10px; background: white; border: 2px solid #4f46e5; }
        .album-step { background: #1e1b4b; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
        .author-tag { font-size: 12px; color: #a5b4fc; font-weight: 700; }
    </style>
</head>
<body>

    <!-- 1. ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="card">
        <div class="header-row">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
            <span>Sketch Relay 2D</span>
        </div>
        <input type="text" id="input-name" placeholder="Твоё имя" maxlength="14">
        
        <div style="display: flex; flex-direction: column; gap: 8px; background: rgba(30,27,75,0.5); padding: 12px; border-radius: 12px;">
            <input type="text" id="create-pass" placeholder="Пароль комнаты (необязательно)" maxlength="16">
            <button id="btn-create" class="btn-green">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Создать комнату</span>
            </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; background: rgba(30,27,75,0.5); padding: 12px; border-radius: 12px;">
            <input type="number" id="input-code" placeholder="Код комнаты (4 цифры)">
            <input type="text" id="join-pass" placeholder="Пароль (если установлен)" maxlength="16">
            <button id="btn-join" class="btn-orange">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                <span>Войти в комнату</span>
            </button>
        </div>
        <div id="menu-error" class="error"></div>
    </div>

    <!-- 2. ЛОББИ КОМНАТЫ -->
    <div id="screen-lobby" class="card hidden">
        <div class="top-bar">
            <div style="font-size: 18px; font-weight: 800; color: #a5b4fc;">
                Код: <span id="lobby-code" style="color: #34d399;">----</span>
            </div>
            <button id="btn-leave" class="btn-red">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span>Выйти</span>
            </button>
        </div>

        <div style="font-size: 13px; color: #cbd5e1;">Режим игры:</div>
        <div class="modes-grid">
            <div class="mode-card active" id="mode-card-normal" data-mode="normal">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                </svg>
                <span>Обычный</span>
            </div>
            <div class="mode-card" id="mode-card-timer" data-mode="timer">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
                    <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/>
                </svg>
                <span>Обычный + таймер</span>
            </div>
        </div>

        <div id="timer-setting-box" class="hidden" style="display: flex; align-items: center; justify-content: space-between; background: #1e1b4b; padding: 8px 12px; border-radius: 10px;">
            <span style="font-size: 13px; font-weight: 600;">Секунд на рисунок:</span>
            <input type="number" id="input-draw-time" value="60" min="15" max="300" style="width: 80px; padding: 6px; text-align: center;">
        </div>

        <div style="font-size: 13px; color: #cbd5e1;">Игроки (<span id="lobby-count">1</span>/10):</div>
        <ul id="lobby-players" class="player-list"></ul>

        <button id="btn-start" class="btn-green hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Начать игру</span>
        </button>
        <div id="lobby-wait-text" style="text-align: center; color: #a5b4fc; font-size: 13px;">Ждём, пока создатель запустит игру...</div>
        <div id="lobby-error" class="error"></div>
    </div>

    <!-- 3. ИГРОВОЙ ЭКРАН -->
    <div id="screen-game" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #a5b4fc; font-weight: 700;">
            <span id="phase-title">Этап 1 из 3</span>
            <span id="timer-badge" class="timer-pill hidden">60 сек</span>
            <span id="wait-counter"></span>
        </div>

        <!-- Этап 1 и 3: Текст -->
        <div id="mode-write" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
            <div id="write-instruction" style="text-align: center; font-weight: 700;"></div>
            <img id="img-to-guess" class="result-img hidden" alt="Рисунок">
            <input type="text" id="input-phrase" placeholder="Напиши сюда..." maxlength="70">
        </div>

        <!-- Этап 2: Рисование -->
        <div id="mode-draw" class="hidden" style="display: flex; flex-direction: column; gap: 8px;">
            <div id="text-to-draw" class="prompt-box"></div>
            <canvas id="draw-canvas" width="400" height="300"></canvas>
            
            <!-- Инструменты: Кисть, Заливка, Линия, Квадрат, Круг, Очистка -->
            <div class="tools-row">
                <button type="button" class="tool-icon-btn active" data-tool="brush" title="Кисть">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                </button>
                <button type="button" class="tool-icon-btn" data-tool="fill" title="Заливка">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11z"/><path d="M5 2l5 5"/><path d="M20 16s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.3 2-3.5 2-3.5z"/></svg>
                </button>
                <button type="button" class="tool-icon-btn" data-tool="line" title="Линия">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="19" x2="19" y2="5"/></svg>
                </button>
                <button type="button" class="tool-icon-btn" data-tool="rect" title="Квадрат">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
                </button>
                <button type="button" class="tool-icon-btn" data-tool="circle" title="Круг">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
                </button>
                <button type="button" id="btn-clear" class="tool-icon-btn" title="Очистить">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>

            <!-- Толщина -->
            <div class="tools-row">
                <button type="button" class="size-btn active" data-size="4">Тонко</button>
                <button type="button" class="size-btn" data-size="10">Средне</button>
                <button type="button" class="size-btn" data-size="20">Толсто</button>
            </div>

            <!-- Выбор цвета: Круг + HEX + быстрые цвета -->
            <div class="color-controls">
                <input type="color" id="color-picker" value="#000000" title="Цветовой круг">
                <input type="text" id="hex-input" value="#000000" maxlength="7" placeholder="#000000">
                <div class="swatches" id="palette"></div>
            </div>
        </div>

        <button id="btn-submit" class="btn-blue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Готово</span>
        </button>
        <div id="waiting-overlay" class="hidden" style="text-align: center; padding: 20px; color: #34d399; font-weight: 700;">
            Ответ отправлен! Ждём остальных игроков...
        </div>
    </div>

    <!-- 4. РЕЗУЛЬТАТЫ -->
    <div id="screen-results" class="card hidden">
        <div class="header-row">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Результаты</span>
        </div>
        <div id="album-title" style="text-align: center; font-weight: 700; color: #34d399; font-size: 14px;"></div>
        <div id="album-content" style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto;"></div>
        <div style="display: flex; gap: 10px;">
            <button id="btn-prev-chain" class="btn-gray">Назад</button>
            <button id="btn-next-chain" class="btn-blue">Далее</button>
        </div>
        <button id="btn-back-lobby" class="btn-green hidden">Вернуться в лобби</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isHost = false;
        let inRoom = false;
        let currentPhase = 0;
        let allCards = [];
        let currentCardIdx = 0;
        let drawTimerInterval = null;
        let submittedCurrentPhase = false;

        // Активность игрока (для таймаута 10 минут)
        let lastPing = 0;
        function reportActivity() {
            if (!inRoom) return;
            const now = Date.now();
            if (now - lastPing > 5000) {
                socket.emit('pingActivity');
                lastPing = now;
            }
        }
        ['touchstart', 'touchmove', 'mousedown', 'keydown', 'input'].forEach(evt => {
            window.addEventListener(evt, reportActivity, { passive: true });
        });

        socket.on('kickedAfk', (msg) => {
            inRoom = false;
            clearInterval(drawTimerInterval);
            document.getElementById('menu-error').textContent = msg;
            showScreen('menu');
        });

        const screens = {
            menu: document.getElementById('screen-menu'),
            lobby: document.getElementById('screen-lobby'),
            game: document.getElementById('screen-game'),
            results: document.getElementById('screen-results')
        };

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        document.getElementById('btn-create').addEventListener('click', () => {
            const playerName = document.getElementById('input-name').value;
            const password = document.getElementById('create-pass').value;
            socket.emit('createRoom', { playerName, password }, handleJoinResponse);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const playerName = document.getElementById('input-name').value;
            const roomCode = document.getElementById('input-code').value.trim();
            const password = document.getElementById('join-pass').value;
            if (!roomCode) return document.getElementById('menu-error').textContent = 'Введите код комнаты!';
            socket.emit('joinRoom', { roomCode, playerName, password }, handleJoinResponse);
        });

        document.getElementById('btn-leave').addEventListener('click', () => {
            socket.emit('leaveRoom');
            inRoom = false;
            document.getElementById('menu-error').textContent = '';
            showScreen('menu');
        });

        function handleJoinResponse(res) {
            if (res.error) {
                document.getElementById('menu-error').textContent = res.error;
                return;
            }
            inRoom = true;
            document.getElementById('menu-error').textContent = '';
            document.getElementById('lobby-code').textContent = res.roomCode;
            renderLobby(res.players, res.isHost ? socket.id : null, res.mode, res.drawTime);
            showScreen('lobby');
        }

        // Выбор режима в лобби
        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', () => {
                if (!isHost) return;
                const mode = card.dataset.mode;
                const drawTime = document.getElementById('input-draw-time').value;
                socket.emit('changeSettings', { mode, drawTime });
            });
        });

        document.getElementById('input-draw-time').addEventListener('change', (e) => {
            if (!isHost) return;
            socket.emit('changeSettings', { drawTime: e.target.value });
        });

        function applySettingsUI(mode, drawTime) {
            document.getElementById('mode-card-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('mode-card-timer').classList.toggle('active', mode === 'timer');
            document.getElementById('mode-card-normal').classList.toggle('disabled', !isHost);
            document.getElementById('mode-card-timer').classList.toggle('disabled', !isHost);

            const timerBox = document.getElementById('timer-setting-box');
            timerBox.classList.toggle('hidden', mode !== 'timer');
            document.getElementById('input-draw-time').value = drawTime || 60;
            document.getElementById('input-draw-time').disabled = !isHost;
        }

        socket.on('updateSettings', (data) => applySettingsUI(data.mode, data.drawTime));

        function renderLobby(players, hostId, mode = 'normal', drawTime = 60) {
            isHost = (hostId === socket.id);
            document.getElementById('lobby-count').textContent = players.length;
            const list = document.getElementById('lobby-players');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.innerHTML = `<span>${p.name}</span>${p.id === hostId ? '<span class="badge">Создатель</span>' : ''}`;
                list.appendChild(li);
            });

            applySettingsUI(mode, drawTime);
            document.getElementById('btn-start').classList.toggle('hidden', !isHost);
            document.getElementById('lobby-wait-text').classList.toggle('hidden', isHost);
        }

        socket.on('updatePlayers', (data) => renderLobby(data.players, data.hostId, data.mode, data.drawTime));
        socket.on('gameError', (msg) => document.getElementById('lobby-error').textContent = msg);

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('lobby-error').textContent = '';
            socket.emit('startGame');
        });

        socket.on('nextPhase', (data) => {
            clearInterval(drawTimerInterval);
            submittedCurrentPhase = false;
            currentPhase = data.phase;

            document.getElementById('phase-title').textContent = `Этап ${data.phase + 1} из 3`;
            document.getElementById('wait-counter').textContent = '';
            document.getElementById('waiting-overlay').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');

            const timerBadge = document.getElementById('timer-badge');
            timerBadge.classList.add('hidden');

            const modeWrite = document.getElementById('mode-write');
            const modeDraw = document.getElementById('mode-draw');
            const imgEl = document.getElementById('img-to-guess');

            if (data.phase === 0) {
                modeDraw.classList.add('hidden');
                modeWrite.classList.remove('hidden');
                imgEl.classList.add('hidden');
                document.getElementById('input-phrase').value = '';
                document.getElementById('write-instruction').textContent = 'Напиши идею для другого игрока:';
            } else if (data.phase === 1) {
                modeWrite.classList.add('hidden');
                modeDraw.classList.remove('hidden');
                document.getElementById('text-to-draw').textContent = data.prompt;
                clearCanvas();

                if (data.timer && data.timer > 0) {
                    let timeLeft = data.timer;
                    timerBadge.textContent = `${timeLeft} сек`;
                    timerBadge.classList.remove('hidden');
                    drawTimerInterval = setInterval(() => {
                        timeLeft--;
                        timerBadge.textContent = `${timeLeft} сек`;
                        if (timeLeft <= 0) {
                            clearInterval(drawTimerInterval);
                            submitCurrentStep(true);
                        }
                    }, 1000);
                }
            } else if (data.phase === 2) {
                modeDraw.classList.add('hidden');
                modeWrite.classList.remove('hidden');
                document.getElementById('input-phrase').value = '';
                document.getElementById('write-instruction').textContent = 'Опиши, что изображено на рисунке:';
                imgEl.src = data.prompt;
                imgEl.classList.remove('hidden');
            }
            showScreen('game');
        });

        socket.on('waitingStatus', (data) => {
            document.getElementById('wait-counter').textContent = `Готово: ${data.ready}/${data.total}`;
        });
        // ==========================================
        // ИНСТРУМЕНТЫ РИСОВАНИЯ: ПАЛИТРА И ЗАЛИВКА
        // ==========================================
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isDrawing = false;
        let currentTool = 'brush'; // brush, fill, line, rect, circle
        let brushColor = '#000000';
        let brushSize = 4;
        let startX = 0, startY = 0;
        let canvasSnapshot = null;

        const colorPicker = document.getElementById('color-picker');
        const hexInput = document.getElementById('hex-input');

        function setColor(hex) {
            if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
            brushColor = hex.toLowerCase();
            colorPicker.value = brushColor;
            hexInput.value = brushColor;
            document.querySelectorAll('.color-dot').forEach(d => {
                d.classList.toggle('active', d.dataset.color === brushColor);
            });
        }

        colorPicker.addEventListener('input', (e) => setColor(e.target.value));
        hexInput.addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) setColor(val);
        });

        const quickColors = ['#000000', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#ffffff'];
        const palette = document.getElementById('palette');
        quickColors.forEach((c, idx) => {
            const dot = document.createElement('div');
            dot.className = 'color-dot' + (idx === 0 ? ' active' : '');
            dot.dataset.color = c;
            dot.style.background = c;
            if (c === '#ffffff') dot.style.border = '2px solid #94a3b8';
            dot.addEventListener('click', () => setColor(c));
            palette.appendChild(dot);
        });

        document.querySelectorAll('[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            });
        });

        document.querySelectorAll('[data-size]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                brushSize = Number(btn.dataset.size);
            });
        });

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        clearCanvas();
        document.getElementById('btn-clear').addEventListener('click', clearCanvas);

        // Алгоритм заливки области (Flood Fill)
        function floodFill(x, y, fillHex) {
            x = Math.floor(x);
            y = Math.floor(y);
            if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width;
            const h = canvas.height;

            const startIdx = (y * w + x) * 4;
            const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2];

            const fillR = parseInt(fillHex.slice(1, 3), 16);
            const fillG = parseInt(fillHex.slice(3, 5), 16);
            const fillB = parseInt(fillHex.slice(5, 7), 16);

            if (Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && Math.abs(startB - fillB) < 5) return;

            const stack = [[x, y]];
            const visited = new Uint8Array(w * h);

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const pos = cy * w + cx;
                if (visited[pos]) continue;
                visited[pos] = 1;

                const idx = pos * 4;
                if (Math.abs(data[idx] - startR) <= 25 && Math.abs(data[idx + 1] - startG) <= 25 && Math.abs(data[idx + 2] - startB) <= 25) {
                    data[idx] = fillR;
                    data[idx + 1] = fillG;
                    data[idx + 2] = fillB;
                    data[idx + 3] = 255;

                    if (cx > 0) stack.push([cx - 1, cy]);
                    if (cx < w - 1) stack.push([cx + 1, cy]);
                    if (cy > 0) stack.push([cx, cy - 1]);
                    if (cy < h - 1) stack.push([cx, cy + 1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
            const clientX = touch ? touch.clientX : e.clientX;
            const clientY = touch ? touch.clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e) {
            e.preventDefault();
            reportActivity();
            const pos = getPos(e);

            if (currentTool === 'fill') {
                floodFill(pos.x, pos.y, brushColor);
                return;
            }

            isDrawing = true;
            startX = pos.x;
            startY = pos.y;
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'brush') {
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
                ctx.stroke();
            } else {
                canvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            reportActivity();
            const pos = getPos(e);

            if (currentTool === 'brush') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (canvasSnapshot) {
                ctx.putImageData(canvasSnapshot, 0, 0);
                ctx.beginPath();
                if (currentTool === 'line') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(pos.x, pos.y);
                } else if (currentTool === 'rect') {
                    ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (currentTool === 'circle') {
                    const radius = Math.hypot(pos.x - startX, pos.y - startY);
                    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                }
                ctx.stroke();
            }
        }

        function endDraw() { isDrawing = false; canvasSnapshot = null; }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw);
        canvas.addEventListener('touchcancel', endDraw);

        function submitCurrentStep(force = false) {
            if (submittedCurrentPhase) return;
            let content = '';
            if (currentPhase === 0 || currentPhase === 2) {
                content = document.getElementById('input-phrase').value.trim();
                if (!content && !force) return;
            } else {
                content = canvas.toDataURL('image/png', 0.85);
            }

            submittedCurrentPhase = true;
            clearInterval(drawTimerInterval);
            document.getElementById('timer-badge').classList.add('hidden');
            document.getElementById('mode-write').classList.add('hidden');
            document.getElementById('mode-draw').classList.add('hidden');
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('waiting-overlay').classList.remove('hidden');

            socket.emit('submitStep', content);
        }

        document.getElementById('btn-submit').addEventListener('click', () => submitCurrentStep(false));

        socket.on('showResults', (cards) => {
            allCards = cards;
            currentCardIdx = 0;
            renderCard();
            document.getElementById('btn-back-lobby').classList.toggle('hidden', !isHost);
            showScreen('results');
        });

        function renderCard() {
            const card = allCards[currentCardIdx];
            if (!card) return;
            document.getElementById('album-title').textContent = `Карточка ${currentCardIdx + 1} из ${allCards.length}`;
            const container = document.getElementById('album-content');
            container.innerHTML = `
                <div class="album-step">
                    <span class="author-tag">Идея (${card.idea.author}):</span>
                    <div style="font-size: 16px; font-weight: 700;">${card.idea.text}</div>
                </div>
                <div class="album-step">
                    <span class="author-tag">Рисунок (${card.drawing.author}):</span>
                    <img src="${card.drawing.img}" class="result-img">
                </div>
                <div class="album-step">
                    <span class="author-tag">Описание (${card.comment.author}):</span>
                    <div style="font-size: 16px; font-weight: 700; color: #34d399;">${card.comment.text}</div>
                </div>
            `;
        }

        document.getElementById('btn-prev-chain').addEventListener('click', () => {
            if (currentCardIdx > 0) { currentCardIdx--; renderCard(); }
        });
        document.getElementById('btn-next-chain').addEventListener('click', () => {
            if (currentCardIdx < allCards.length - 1) { currentCardIdx++; renderCard(); }
        });
        document.getElementById('btn-back-lobby').addEventListener('click', () => socket.emit('restartLobby'));
        socket.on('backToLobby', (data) => {
            renderLobby(data.players, data.hostId, data.mode, data.drawTime);
            showScreen('lobby');
        });
    </script>
</body>
</html>
