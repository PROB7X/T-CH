<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Червячки Онлайн</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let myPos = { x: canvas.width / 2, y: canvas.height / 2 };
        let target = { x: myPos.x, y: myPos.y };
        let players = {};
        let tail = [];

        window.addEventListener('mousemove', e => { target = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('touchmove', e => {
            target = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        socket.on('state', serverPlayers => { players = serverPlayers; });

        function update() {
            const dx = target.x - myPos.x;
            const dy = target.y - myPos.y;
            const angle = Math.atan2(dy, dx);
            const speed = 3;

            myPos.x += Math.cos(angle) * speed;
            myPos.y += Math.sin(angle) * speed;

            tail.push({ x: myPos.x, y: myPos.y });
            if (tail.length > 25) tail.shift();

            socket.emit('move', myPos);
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем свой хвост
            tail.forEach((part, index) => {
                ctx.beginPath();
                ctx.arc(part.x, part.y, 10 + index * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = '#4caf50';
                ctx.fill();
            });

            // Рисуем других игроков
            for (let id in players) {
                if (id !== socket.id) {
                    ctx.beginPath();
                    ctx.arc(players[id].x, players[id].y, 15, 0, Math.PI * 2);
                    ctx.fillStyle = players[id].color;
                    ctx.fill();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
