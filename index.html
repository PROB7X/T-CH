<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NioLit OS Mobile</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 15%, #1e293b 0%, #0f172a 55%, #020617 100%);
      --glass: rgba(15, 23, 42, 0.88);
      --glass-light: rgba(30, 41, 59, 0.92);
      --border: rgba(148, 163, 184, 0.22);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --nav-h: 52px;
      --status-h: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text);
      touch-action: manipulation;
    }

    /* Статус-бар телефона сверху */
    #status-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--status-h);
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12px;
      z-index: 8000;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    /* Рабочий стол (сетка приложений как на смартфоне) */
    #desktop {
      position: relative;
      width: 100vw;
      height: calc(100vh - var(--status-h) - var(--nav-h));
      margin-top: var(--status-h);
      padding: 24px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      grid-auto-rows: 96px;
      gap: 16px;
      align-content: start;
      overflow-y: auto;
    }

    .watermark {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .desktop-icon:active {
      transform: scale(0.92);
    }
    .desktop-icon .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--glass-light);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .desktop-icon span {
      font-size: 12px;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* Окна (адаптированы под мобильный экран) */
    .window {
      position: fixed;
      top: var(--status-h);
      left: 0;
      width: 100vw;
      height: calc(100vh - var(--status-h) - var(--nav-h));
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
    }

    /* Строгий 100% Culling */
    .window.culled {
      display: none !important;
    }

    .window-header {
      height: 44px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .window-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .win-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .win-btn.close:active { background: var(--danger); }

    .window-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      user-select: text;
      display: flex;
      flex-direction: column;
    }

    /* Нижняя панель навигации телефона */
    #navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--nav-h);
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 9000;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      padding: 8px 24px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:active {
      background: rgba(255,255,255,0.12);
      color: var(--text);
    }

    /* Диспетчер открытых приложений (недавние) */
    #recents-drawer {
      position: fixed;
      inset: var(--status-h) 0 var(--nav-h) 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      z-index: 8500;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    #recents-drawer.hidden { display: none; }
    .recent-card {
      background: var(--glass-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Оверлеи: Fullscreen и Вход */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(20px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay-screen.hidden {
      display: none !important;
    }
    #close-fs-overlay {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }
    .card-box {
      width: 100%;
      max-width: 360px;
      background: var(--glass-light);
      border: 1px solid var(--border);
      padding: 26px 22px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-box h1 {
      font-size: 26px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-box p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .primary-btn {
      background: var(--accent);
      color: #020617;
      border: none;
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .primary-btn:active { background: var(--accent-hover); }

    .app-input, .app-textarea {
      width: 100%;
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .app-input:focus, .app-textarea:focus {
      border-color: var(--accent);
    }
    .app-btn {
      background: var(--accent);
      color: #020617;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Стили соцсети NioGram */
    .social-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #020617;
      border-color: var(--accent);
    }
    .feed-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-card {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .post-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .post-text {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
    }
    .user-row:active {
      border-color: var(--accent);
    }
    .msg-bubble {
      max-width: 82%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
    }
    .msg-mine {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.45);
    }
    .msg-other {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border);
    }
    .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }

    /* Терминал */
    .terminal-box {
      background: #020617;
      color: #4ade80;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 10px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Калькулятор */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
      flex: 1;
    }
    .calc-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .calc-btn:active { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- 1. Экран полноэкранного режима -->
  <div id="fullscreen-overlay" class="overlay-screen">
    <button id="close-fs-overlay" title="Отказаться">✕</button>
    <div class="card-box">
      <h1>NioLit OS</h1>
      <p>Мобильная веб-система. Нажмите кнопку ниже, чтобы развернуть на весь экран.</p>
      <button id="enter-fs-btn" class="primary-btn">На весь экран</button>
    </div>
  </div>

  <!-- 2. Экран входа (Имя и необязательный пароль) -->
  <div id="login-overlay" class="overlay-screen hidden">
    <div class="card-box">
      <h1>Вход в NioLit</h1>
      <p>Введите ваше имя пользователя. Пароль устанавливается по желанию.</p>
      <input type="text" id="login-username" class="app-input" placeholder="Имя пользователя (обязательно)" maxlength="20" />
      <input type="password" id="login-password" class="app-input" placeholder="Пароль (необязательно)" maxlength="32" />
      <div id="login-error" style="color:var(--danger); font-size:12px; display:none;"></div>
      <button id="login-submit-btn" class="primary-btn">Войти в систему</button>
    </div>
  </div>

  <!-- Верхний статус-бар смартфона -->
  <header id="status-bar">
    <div class="status-left">
      <span id="clock">00:00</span>
      <span id="current-user-badge" style="color:var(--accent); font-weight:700;">@Гость</span>
    </div>
    <div class="status-right">
      <span id="culling-stat">Рендер: 0/0</span>
      <span class="status-dot" id="srv-dot"></span>
      <span id="srv-text">:3000</span>
    </div>
  </header>

  <!-- Рабочий стол смартфона -->
  <main id="desktop">
    <div class="watermark">NIOLIT MOBILE</div>
  </main>

  <!-- Диспетчер запущенных приложений -->
  <div id="recents-drawer" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="font-size:16px;">Активные приложения</strong>
      <button class="app-btn" id="close-all-apps" style="background:var(--danger); color:#fff; padding:6px 12px; font-size:12px;">Закрыть все</button>
    </div>
    <div id="recents-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- Нижняя панель навигации смартфона -->
  <nav id="navbar">
    <button class="nav-btn" id="nav-back" title="Назад">◀</button>
    <button class="nav-btn" id="nav-home" title="Домой">●</button>
    <button class="nav-btn" id="nav-recents" title="Открытые окна">■</button>
  </nav>

<script>
(() => {
  /* =========================================================================
     ПОДКЛЮЧЕНИЕ К ПОРТУ 3000
     ========================================================================= */
  const API_BASE = window.location.port === '3000'
    ? ''
    : `${window.location.protocol}//${window.location.hostname}:3000`;

  let serverOnline = false;
  let currentUser = localStorage.getItem('niolit_user') || '';
  let currentPass = localStorage.getItem('niolit_pass') || '';

  async function apiRequest(path, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        signal: controller.signal
      });
      clearTimeout(timer);
      serverOnline = true;
      updateServerBadge();
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      serverOnline = false;
      updateServerBadge();
      return null;
    }
  }

  function updateServerBadge() {
    const dot = document.getElementById('srv-dot');
    const txt = document.getElementById('srv-text');
    if (serverOnline) {
      dot.style.background = '#22c55e';
      txt.textContent = 'Онлайн (:3000)';
    } else {
      dot.style.background = '#eab308';
      txt.textContent = 'Офлайн';
    }
  }

  /* =========================================================================
     1. ПОЛНОЭКРАННЫЙ РЕЖИМ И ЭКРАН ВХОДА
     ========================================================================= */
  const fsOverlay = document.getElementById('fullscreen-overlay');
  const loginOverlay = document.getElementById('login-overlay');
  const enterFsBtn = document.getElementById('enter-fs-btn');
  const closeFsBtn = document.getElementById('close-fs-overlay');

  function showLoginIfNeeded() {
    if (!currentUser) {
      loginOverlay.classList.remove('hidden');
    } else {
      document.getElementById('current-user-badge').textContent = '@' + currentUser;
      // Тихо регистрируем/обновляем онлайн-статус на сервере
      apiRequest('/api/auth', {
        method: 'POST',
        body: JSON.stringify({ username: currentUser, password: currentPass })
      });
    }
  }

  enterFsBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
    } catch (e) {}
    fsOverlay.classList.add('hidden');
    showLoginIfNeeded();
  });

  closeFsBtn.addEventListener('click', () => {
    fsOverlay.classList.add('hidden');
    showLoginIfNeeded();
  });

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fsOverlay.classList.add('hidden');
    } else {
      // Если игрок вышел из полноэкранного режима — кнопка возвращается
      fsOverlay.classList.remove('hidden');
    }
  });

  // Обработка входа пользователя
  document.getElementById('login-submit-btn').addEventListener('click', async () => {
    const uInput = document.getElementById('login-username');
    const pInput = document.getElementById('login-password');
    const errBox = document.getElementById('login-error');

    const username = uInput.value.trim();
    const password = pInput.value.trim();

    if (!username) {
      errBox.textContent = 'Введите имя пользователя!';
      errBox.style.display = 'block';
      return;
    }

    const res = await apiRequest('/api/auth', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });

    if (res && res.error) {
      errBox.textContent = res.error;
      errBox.style.display = 'block';
      return;
    }

    currentUser = username;
    currentPass = password;
    localStorage.setItem('niolit_user', currentUser);
    localStorage.setItem('niolit_pass', currentPass);
    document.getElementById('current-user-badge').textContent = '@' + currentUser;
    errBox.style.display = 'none';
    loginOverlay.classList.add('hidden');
  });

  /* =========================================================================
     2. УМНЫЙ РЕНДЕР (OCCLUSION CULLING 100%)
     ========================================================================= */
  const windowsState = [];
  let topZIndex = 100;

  function updateRenderCulling() {
    const sorted = [...windowsState].sort((a, b) => b.zIndex - a.zIndex);
    let topFullWindowShown = false;
    let renderedCount = 0;

    for (const win of sorted) {
      // На смартфоне активное окно занимает 100% экрана и полностью перекрывает все окна под ним
      if (win.minimized || topFullWindowShown) {
        win.el.classList.add('culled');
      } else {
        win.el.classList.remove('culled');
        topFullWindowShown = true;
        renderedCount++;
      }
    }

    document.getElementById('culling-stat').textContent = `Рендер: ${renderedCount}/${windowsState.length}`;
  }

  /* =========================================================================
     3. СОЦСЕТЬ NIOGRAM (ЛЕНТА + ЛИЧНЫЕ ЧАТЫ С АВТОУДАЛЕНИЕМ ЧЕРЕЗ 7 ДНЕЙ)
     ========================================================================= */
  const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

  function formatRemainingDays(createdAt) {
    const leftMs = (createdAt + SEVEN_DAYS_MS) - Date.now();
    if (leftMs <= 0) return 'удаляется...';
    const days = Math.ceil(leftMs / (24 * 60 * 60 * 1000));
    return `исчезнет через ${days} дн.`;
  }

  const APPS = [
    {
      id: 'niogram',
      name: 'NioGram',
      icon: '🌐',
      render: (container) => {
        container.innerHTML = `
          <div class="social-tabs">
            <button class="tab-btn active" data-tab="feed">Лента</button>
            <button class="tab-btn" data-tab="users">Личные чаты</button>
          </div>
          <div id="niogram-view" style="flex:1; display:flex; flex-direction:column; overflow:hidden;"></div>
        `;

        const view = container.querySelector('#niogram-view');
        const tabs = container.querySelectorAll('.tab-btn');
        let pollTimer = null;

        function clearPoll() {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        // Вкладка 1: Общая лента постов
        async function openFeed() {
          clearPoll();
          view.innerHTML = `
            <div style="display:flex; gap:6px; margin-bottom:10px;">
              <input type="text" id="post-inp" class="app-input" placeholder="Опубликовать запись..." />
              <button id="post-send" class="app-btn">Пост</button>
            </div>
            <div class="feed-list" id="feed-list">Загрузка...</div>
          `;

          const list = view.querySelector('#feed-list');

          async function loadPosts() {
            const data = await apiRequest('/api/posts');
            if (!data) {
              list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Нет связи с сервером :3000</p>';
              return;
            }
            if (data.length === 0) {
              list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Постов пока нет.</p>';
              return;
            }
            list.innerHTML = data.map(p => `
              <div class="post-card">
                <div class="post-author">
                  <span>@${p.author}</span>
                  <span style="color:#64748b; font-weight:400; font-size:11px;">${p.time}</span>
                </div>
                <div class="post-text">${p.text}</div>
                <div style="margin-top:8px;">
                  <button class="like-btn" data-id="${p.id}" style="background:none; border:none; color:#f43f5e; font-size:13px; cursor:pointer;">❤️ ${p.likes}</button>
                </div>
              </div>
            `).join('');

            list.querySelectorAll('.like-btn').forEach(btn => {
              btn.onclick = async () => {
                await apiRequest(`/api/posts/${btn.dataset.id}/like`, { method: 'POST' });
                loadPosts();
              };
            });
          }

          view.querySelector('#post-send').onclick = async () => {
            const inp = view.querySelector('#post-inp');
            const text = inp.value.trim();
            if (!text) return;
            inp.value = '';
            await apiRequest('/api/posts', {
              method: 'POST',
              body: JSON.stringify({ author: currentUser || 'Гость', text })
            });
            loadPosts();
          };

          loadPosts();
          pollTimer = setInterval(loadPosts, 4000);
        }

        // Вкладка 2: Список пользователей для личных чатов
        async function openUsersList() {
          clearPoll();
          view.innerHTML = `
            <div style="display:flex; gap:6px; margin-bottom:10px;">
              <input type="text" id="direct-user-inp" class="app-input" placeholder="Ник собеседника..." />
              <button id="open-direct-btn" class="app-btn">Чат</button>
            </div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">
              Пользователи в сети (сообщения хранятся 7 дней):
            </div>
            <div class="feed-list" id="users-list">Загрузка...</div>
          `;

          const list = view.querySelector('#users-list');

          view.querySelector('#open-direct-btn').onclick = () => {
            const target = view.querySelector('#direct-user-inp').value.trim();
            if (target && target !== currentUser) openPrivateChat(target);
          };

          const users = await apiRequest('/api/users');
          if (!users) {
            list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Сервер недоступен</p>';
            return;
          }

          const others = users.filter(u => u !== currentUser);
          if (others.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Других пользователей пока нет. Введите ник вручную сверху.</p>';
            return;
          }

          list.innerHTML = others.map(u => `
            <div class="user-row" data-user="${u}">
              <div>
                <strong style="color:var(--accent);">@${u}</strong>
                <div style="font-size:11px; color:var(--text-muted);">Нажмите, чтобы открыть личный чат</div>
              </div>
              <span>💬</span>
            </div>
          `).join('');

          list.querySelectorAll('.user-row').forEach(row => {
            row.onclick = () => openPrivateChat(row.dataset.user);
          });
        }

        // Личный чат с конкретным пользователем
        async function openPrivateChat(peer) {
          clearPoll();
          view.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:8px;">
              <button id="back-to-users" class="app-btn" style="padding:6px 10px; font-size:12px;">← Назад</button>
              <strong style="color:var(--accent);">Чат с @${peer}</strong>
              <span style="font-size:10px; color:var(--text-muted);">⏳ 7 дн.</span>
            </div>
            <div class="feed-list" id="pm-list" style="margin-bottom:8px;">Загрузка переписки...</div>
            <div style="display:flex; gap:6px;">
              <input type="text" id="pm-input" class="app-input" placeholder="Личное сообщение..." />
              <button id="pm-send" class="app-btn">➤</button>
            </div>
          `;

          view.querySelector('#back-to-users').onclick = openUsersList;
          const list = view.querySelector('#pm-list');

          async function loadMessages() {
            const msgs = await apiRequest(`/api/dm?u1=${encodeURIComponent(currentUser)}&u2=${encodeURIComponent(peer)}`);
            if (!msgs) return;
            if (msgs.length === 0) {
              list.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-size:12px; margin-top:20px;">Сообщений нет. Все сообщения автоматически удаляются через 7 дней.</p>';
              return;
            }
            list.innerHTML = msgs.map(m => {
              const isMine = m.from === currentUser;
              return `
                <div class="msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}">
                  <div>${m.text}</div>
                  <div class="msg-meta">${m.time} • ${formatRemainingDays(m.createdAt)}</div>
                </div>
              `;
            }).join('');
            list.scrollTop = list.scrollHeight;
          }

          view.querySelector('#pm-send').onclick = async () => {
            const inp = view.querySelector('#pm-input');
            const text = inp.value.trim();
            if (!text) return;
            inp.value = '';
            await apiRequest('/api/dm', {
              method: 'POST',
              body: JSON.stringify({ from: currentUser, to: peer, text })
            });
            loadMessages();
          };

          loadMessages();
          pollTimer = setInterval(loadMessages, 3000);
        }

        tabs.forEach(t => {
          t.onclick = () => {
            tabs.forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            t.dataset.tab === 'feed' ? openFeed() : openUsersList();
          };
        });

        openFeed();
      }
    },
    {
      id: 'profile',
      name: 'Профиль',
      icon: '👤',
      render: (container) => {
        container.innerHTML = `
          <div class="post-card" style="display:flex; flex-direction:column; gap:12px;">
            <h3>Аккаунт NioLit</h3>
            <p style="font-size:13px; color:var(--text-muted);">Текущий пользователь: <strong style="color:var(--accent);">@${currentUser || 'Гость'}</strong></p>
            <p style="font-size:13px; color:var(--text-muted);">Пароль: ${currentPass ? '•••••••• (установлен)' : 'не задан'}</p>
            <button id="logout-btn" class="app-btn" style="background:var(--danger); color:#fff;">Сменить пользователя</button>
          </div>
        `;
        container.querySelector('#logout-btn').onclick = () => {
          localStorage.removeItem('niolit_user');
          localStorage.removeItem('niolit_pass');
          currentUser = '';
          currentPass = '';
          loginOverlay.classList.remove('hidden');
        };
      }
    },
    {
      id: 'terminal',
      name: 'Терминал',
      icon: '💻',
      render: (container) => {
        container.innerHTML = `
          <div class="terminal-box" id="term-out">
            <div>NioLit Mobile Kernel v2.0</div>
            <div>Введите <b>help</b> для списка команд.</div>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <input type="text" class="app-input" id="term-in" placeholder="help / ping / clear..." />
            <button class="app-btn" id="term-run">OK</button>
          </div>
        `;
        const out = container.querySelector('#term-out');
        const inp = container.querySelector('#term-in');
        const log = (msg) => {
          const d = document.createElement('div');
          d.innerHTML = msg;
          out.appendChild(d);
          out.scrollTop = out.scrollHeight;
        };
        const exec = async () => {
          const cmd = inp.value.trim();
          if (!cmd) return;
          log(`<span style="color:#38bdf8">$</span> ${cmd}`);
          inp.value = '';
          if (cmd === 'help') log('Команды: <b>ping</b>, <b>user</b>, <b>clear</b>');
          else if (cmd === 'clear') out.innerHTML = '';
          else if (cmd === 'user') log(`Активный профиль: @${currentUser}`);
          else if (cmd === 'ping') {
            const r = await apiRequest('/api/posts');
            log(r ? '<span style="color:#22c55e">Сервер :3000 доступен</span>' : '<span style="color:#ef4444">Нет ответа от :3000</span>');
          } else log('Неизвестная команда');
        };
        container.querySelector('#term-run').onclick = exec;
      }
    },
    {
      id: 'notes',
      name: 'Заметки',
      icon: '📝',
      render: (container) => {
        const saved = localStorage.getItem('niolit_notes') || '';
        container.innerHTML = `
          <textarea class="app-textarea" style="flex:1; resize:none; margin-bottom:8px;" placeholder="Ваши заметки...">${saved}</textarea>
          <button class="app-btn" id="save-note">Сохранить</button>
        `;
        container.querySelector('#save-note').onclick = () => {
          localStorage.setItem('niolit_notes', container.querySelector('textarea').value);
          container.querySelector('#save-note').textContent = 'Сохранено ✓';
          setTimeout(() => container.querySelector('#save-note').textContent = 'Сохранить', 1500);
        };
      }
    },
    {
      id: 'calc',
      name: 'Калькулятор',
      icon: '🧮',
      render: (container) => {
        container.innerHTML = `
          <input type="text" id="calc-disp" class="app-input" style="text-align:right; font-size:22px; font-weight:700;" readonly value="0" />
          <div class="calc-grid">
            ${['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(k => `<button class="calc-btn">${k}</button>`).join('')}
          </div>
        `;
        const disp = container.querySelector('#calc-disp');
        container.querySelectorAll('.calc-btn').forEach(b => {
          b.onclick = () => {
            const v = b.textContent;
            if (v === 'C') disp.value = '0';
            else if (v === '=') {
              try { disp.value = Function('"use strict";return (' + disp.value + ')')(); }
              catch { disp.value = 'Ошибка'; }
            } else {
              disp.value = disp.value === '0' ? v : disp.value + v;
            }
          };
        });
      }
    }
  ];

  /* =========================================================================
     МОБИЛЬНЫЙ МЕНЕДЖЕР ПРИЛОЖЕНИЙ И НАВИГАЦИЯ
     ========================================================================= */
  const desktop = document.getElementById('desktop');
  const recentsDrawer = document.getElementById('recents-drawer');
  const recentsList = document.getElementById('recents-list');

  APPS.forEach(app => {
    const icon = document.createElement('div');
    icon.className = 'desktop-icon';
    icon.innerHTML = `<div class="icon-box">${app.icon}</div><span>${app.name}</span>`;
    icon.onclick = () => openApp(app);
    desktop.appendChild(icon);
  });

  function focusWindow(winObj) {
    recentsDrawer.classList.add('hidden');
    topZIndex++;
    winObj.zIndex = topZIndex;
    winObj.el.style.zIndex = topZIndex;
    winObj.minimized = false;
    updateRenderCulling();
  }

  function closeWindow(winObj) {
    const idx = windowsState.indexOf(winObj);
    if (idx > -1) windowsState.splice(idx, 1);
    winObj.el.remove();
    updateRenderCulling();
    renderRecents();
  }

  function openApp(app) {
    const existing = windowsState.find(w => w.appId === app.id);
    if (existing) {
      focusWindow(existing);
      return;
    }

    const winObj = {
      id: 'win_' + Date.now(),
      appId: app.id,
      title: app.name,
      icon: app.icon,
      zIndex: ++topZIndex,
      minimized: false,
      el: null
    };

    const winEl = document.createElement('div');
    winEl.className = 'window';
    winEl.style.zIndex = winObj.zIndex;

    winEl.innerHTML = `
      <div class="window-header">
        <div class="window-title"><span>${app.icon}</span><span>${app.name}</span></div>
        <button class="win-btn close" title="Закрыть">✕</button>
      </div>
      <div class="window-body"></div>
    `;

    winObj.el = winEl;
    document.body.appendChild(winEl);
    windowsState.push(winObj);

    app.render(winEl.querySelector('.window-body'));

    winEl.querySelector('.close').onclick = () => closeWindow(winObj);
    updateRenderCulling();
  }

  // Нижние кнопки навигации смартфона
  document.getElementById('nav-home').onclick = () => {
    recentsDrawer.classList.add('hidden');
    windowsState.forEach(w => w.minimized = true);
    updateRenderCulling();
  };

  document.getElementById('nav-back').onclick = () => {
    if (!recentsDrawer.classList.contains('hidden')) {
      recentsDrawer.classList.add('hidden');
      return;
    }
    const visibleWin = [...windowsState]
      .filter(w => !w.minimized)
      .sort((a, b) => b.zIndex - a.zIndex)[0];
    if (visibleWin) {
      visibleWin.minimized = true;
      updateRenderCulling();
    }
  };

  function renderRecents() {
    recentsList.innerHTML = '';
    if (windowsState.length === 0) {
      recentsList.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20px;">Нет открытых приложений</p>';
      return;
    }
    windowsState.forEach(win => {
      const card = document.createElement('div');
      card.className = 'recent-card';
      card.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; font-weight:600;">
          <span style="font-size:22px;">${win.icon}</span>
          <span>${win.title}</span>
        </div>
        <button class="win-btn close">✕</button>
      `;
      card.onclick = (e) => {
        if (e.target.classList.contains('close')) {
          closeWindow(win);
        } else {
          focusWindow(win);
        }
      };
      recentsList.appendChild(card);
    });
  }

  document.getElementById('nav-recents').onclick = () => {
    if (recentsDrawer.classList.contains('hidden')) {
      renderRecents();
      recentsDrawer.classList.remove('hidden');
    } else {
      recentsDrawer.classList.add('hidden');
    }
  };

  document.getElementById('close-all-apps').onclick = () => {
    while (windowsState.length > 0) {
      windowsState[0].el.remove();
      windowsState.shift();
    }
    updateRenderCulling();
    renderRecents();
  };

  // Часы и проверка связи
  setInterval(() => {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }, 1000);

  apiRequest('/api/posts');
})();
</script>
</body>
</html>
