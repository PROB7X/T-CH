<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онлайн Червячки</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        #login {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            margin-bottom: 10px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Очки: <span id="score">0</span></div>
        <div>Игроков онлайн: <span id="online">1</span></div>
    </div>

    <div id="login">
        <h2>Онлайн Червячки</h2>
        <input type="text" id="nick" placeholder="Ваш ник" maxlength="15"><br>
        <button onclick="startGame()">Играть</button>
    </div>

    <canvas id="game"></canvas>

    <script>
        const SERVER_IP = "103.82.102.226";
        const SERVER_PORT = "8000";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let myId = null;
        let mapSize = 2000;
        let players = {};
        let food = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        const ws = new WebSocket(`ws://${SERVER_IP}:${SERVER_PORT}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "init") {
                myId = data.id;
                mapSize = data.map_size;
            } else if (data.type === "state") {
                players = data.players;
                food = data.food;
                document.getElementById("online").textContent = Object.keys(players).length;
                if (myId && players[myId]) {
                    document.getElementById("score").textContent = players[myId].score;
                }
            }
        };

        function startGame() {
            const nick = document.getElementById("nick").value.trim();
            if (nick && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "name", name: nick }));
            }
            document.getElementById("login").style.display = "none";
        }

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener("touchmove", (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        setInterval(() => {
            if (myId && players[myId] && ws.readyState === WebSocket.OPEN) {
                const me = players[myId];
                const worldX = me.x + (mouseX - canvas.width / 2);
                const worldY = me.y + (mouseY - canvas.height / 2);
                ws.send(JSON.stringify({ type: "move", x: worldX, y: worldY }));
            }
        }, 50);

        function draw() {
            ctx.fillStyle = "#181818";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!myId || !players[myId]) {
                requestAnimationFrame(draw);
                return;
            }

            const me = players[myId];
            const camX = me.x - canvas.width / 2;
            const camY = me.y - canvas.height / 2;

            ctx.save();
            ctx.translate(-camX, -camY);

            // Границы карты
            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, mapSize, mapSize);

            // Сетка фона
            ctx.strokeStyle = "#252525";
            ctx.lineWidth = 1;
            for (let x = 0; x <= mapSize; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapSize); ctx.stroke();
            }
            for (let y = 0; y <= mapSize; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapSize, y); ctx.stroke();
            }

            // Еда
            for (const f of food) {
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Игроки
            for (const pid in players) {
                const p = players[pid];
                ctx.fillStyle = p.color;
                for (let i = p.body.length - 1; i >= 0; i--) {
                    const seg = p.body[i];
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, i === 0 ? 14 : 11, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Имя игрока
                ctx.fillStyle = "white";
                ctx.font = "14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y - 20);
            }

            ctx.restore();
            requestAnimationFrame(draw);
        }

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        draw();
    </script>
</body>
</html>
